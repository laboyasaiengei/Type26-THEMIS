  useEffect(() => {
    const unsub = db.collection("backups").orderBy("createdAt", "desc").onSnapshot(
      (snap) => setBackups(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      (err) => {
        console.error("backups subscription error", err);
        setError(err);
      }
    );
    return () => unsub();
  }, []);

  return (
    <div>
      <TopBar title="バックアップから復元" onBack={onBack} />
      <div style={{ padding: 16, paddingBottom: 60 }}>
        <div style={{ fontSize: 12, color: C.inkSoft, lineHeight: 1.7, marginBottom: 14, background: C.lockBg, borderRadius: 10, padding: "10px 12px" }}>
          復元すると、選択した時点の内容で現在のデータがすべて置き換わります。一覧から内容を確認してから実行してください。
        </div>

        {backups === null && !error && (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <Spinner />
          </div>
        )}

        {error && (
          <div style={{ textAlign: "center", padding: "30px 12px", color: C.danger, fontSize: 13 }}>
            バックアップ一覧の取得に失敗しました。
          </div>
        )}

        {backups && backups.length === 0 && (
          <div style={{ textAlign: "center", padding: "40px 12px", color: C.inkSoft, fontSize: 13, lineHeight: 1.8 }}>
            まだバックアップがありません。
            <br />
            自動バックアップは1時間ごとに作成され、直近5日分まで残ります。
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {backups &&
            backups.map((b) => (
              <button
                key={b.id}
                onClick={() => onSelectBackup(b.id)}
                style={{ textAlign: "left", background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12, padding: "13px 14px", cursor: "pointer", display: "flex", alignItems: "center", gap: 10 }}
              >
                <Calendar size={16} color={C.inkSoft} style={{ flexShrink: 0 }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 13.5, color: C.ink }}>{formatBackupDate(b.createdAt)}</div>
                  <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 3 }}>
                    {b.type === "auto" ? "自動バックアップ" : "手動バックアップ"}
                    {b.counts ? ` ・ 薬品${b.counts.chemicals ?? 0}件`: ""}
                  </div>
                </div>
                <ChevronRight size={16} color={C.inkSoft} />
              </button>
            ))}
        </div>
      </div>
    </div>
  );
}

function RestoreBackupPreviewPage({ backupId, onBack, onRestore }) {
  const [detail, setDetail] = useState(null);
  const [error, setError] = useState(null);
  const [restoring, setRestoring] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const backupRef = db.collection("backups").doc(backupId);
        const metaSnap = await withDbTimeout(backupRef.get(), "restorePreview-meta-get-timeout");
        if (cancelled) return;
        if (!metaSnap.exists) {
          setError("このバックアップは見つかりませんでした。");
          return;
        }
        setDetail({
          meta: metaSnap.data(),
        });
      } catch (e) {
        console.error("backup preview fetch error", e);
        if (!cancelled) setError("バックアップの内容を取得できませんでした。");
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [backupId]);

  const handleConfirmRestore = () => {
    if (typeof window !== "undefined" && window.confirm) {
      const ok = window.confirm(
        "この内容で復元します。現在の薬品・廃液分類・保管場所などのデータはすべて上書きされ、元に戻せません。本当によろしいですか？"
      );
      if (!ok) return;
    }
    setRestoring(true);
    onRestore(backupId).finally(() => setRestoring(false));
  };

  return (
    <div>
      <TopBar title="復元内容の確認" onBack={onBack} />
      <div style={{ padding: 16, paddingBottom: 100 }}>
        {!detail && !error && (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <Spinner />
          </div>
        )}

        {error && <div style={{ textAlign: "center", padding: "30px 12px", color: C.danger, fontSize: 13 }}>{error}</div>}

        {detail && (
          <>
            <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12, padding: "14px 16px", marginBottom: 14 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: C.ink, marginBottom: 8 }}>
                {formatBackupDate(detail.meta.createdAt)}
                <span style={{ marginLeft: 8, fontSize: 11, fontWeight: 600, color: C.inkSoft }}>
                  {detail.meta.type === "auto" ? "（自動バックアップ）" : "（手動バックアップ）"}
                </span>
              </div>
              <div style={{ fontSize: 12.5, color: C.inkSoft, lineHeight: 1.9 }}>
                薬品：{detail.meta.counts?.chemicals ?? 0}件
                <br />
                廃液分類：{detail.meta.counts?.wasteCategories ?? 0}件
                <br />
                廃液投入記録：{detail.meta.counts?.wasteEntries ?? 0}件
                <br />
                保管場所：{detail.meta.counts?.locations ?? 0}件
              </div>
            </div>

            <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: C.dangerBg, border: `1px solid ${C.danger}`, borderRadius: 10, padding: "12px 14px", marginBottom: 20 }}>
              <AlertTriangle size={16} color={C.danger} style={{ flexShrink: 0, marginTop: 1 }} />
              <div style={{ fontSize: 12, color: C.ink, lineHeight: 1.7 }}>
                復元を実行すると、現在の薬品・廃液分類・保管場所などのデータがすべてこの時点の内容に置き換わります。管理者パスコードもこの時点のものに戻ります。この操作は元に戻せません。
              </div>
            </div>

            <button
              onClick={handleConfirmRestore}
              disabled={restoring}
              style={{ width: "100%", border: "none", background: restoring ? "#B7C0BC" : C.danger, color: "#fff", fontSize: 14.5, fontWeight: 700, borderRadius: 12, padding: "13px", cursor: restoring ? "not-allowed" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
            >
              {restoring ? (
                "復元しています…"
              ) : (
                <>
                  <RotateCcw size={16} /> この内容で復元する
                </>
              )}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function ChemStockApp() {
  const [chemicals, setChemicals] = useState([]);
  const [wasteMeta, setWasteMeta] = useState([]);
  const [wasteEntriesRaw, setWasteEntriesRaw] = useState([]);
  const [locationsMeta, setLocationsMeta] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadingStep, setLoadingStep] = useState("初期化中…");
  const [fatalError, setFatalError] = useState(firebaseInitError ? String(firebaseInitError.message || firebaseInitError) : null);
  const [homeTab, setHomeTab] = useState("search");
  const [searchQuery, setSearchQuery] = useState("");
  const [stack, setStack] = useState([{ view: "home" }]);
const [passcodeGate, setPasscodeGate] = useState(null);
const [adminPasscode, setAdminPasscode] = useState(DEFAULT_ADMIN_PASSCODE);
const [theme, setTheme] = useState("light");
Object.assign(C, theme === "dark" ? DARK_TOKENS : LIGHT_TOKENS);
useEffect(() => {
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.colorScheme = theme;
}, [theme]);
const toggleTheme = () => {
  const next = theme === "dark" ? "light" : "dark";
  const curtain = document.getElementById("themeCurtain");
  if (!curtain) {
    // 万一カーテン要素が無い場合は従来通り即切り替え
    setTheme(next);
    return;
  }
  // 1) 切り替え後の背景色でカーテンを画面全体にフェードイン（覆い隠す）
  curtain.style.background = next === "dark" ? DARK_TOKENS.bg : LIGHT_TOKENS.bg;
  curtain.style.opacity = "1";
  // 2) カーテンが覆い切ったタイミングで、Reactの状態を裏側で切り替える
  window.setTimeout(() => {
    setTheme(next);
    // 3) 切り替え済みの画面をカーテンごしにフェードアウトさせて見せる
    requestAnimationFrame(() => {
      curtain.style.opacity = "0";
    });
  }, 260);
};

  const handleManualRefresh = async () => {
    try {
      const count = await caesarRestRefreshAll();
      showToast(count ? "最新データに更新しました" : "更新対象はありません");
    } catch (e) {
      if (caesarRestIsQuotaError(e)) {
        showToast("Firestoreのread上限に近いため、更新を一時停止しています", true);
      } else {
        toastFail("データ更新", e);
      }
    }
  };

  // ログイン（匿名）→ 初回だけデータ取得 → ローカル購読キャッシュ、の順で立ち上げる。
  // どこで失敗しても画面が真っ白にならないよう、必ずエラーを画面に出す。
  useEffect(() => {
    if (firebaseInitError) return;
    let unsubChem, unsubWaste, unsubEntries, unsubSettings, unsubLocations;
    let cancelled = false;

    const unsubAll = () => {
      if (unsubChem) { unsubChem(); unsubChem = null; }
      if (unsubWaste) { unsubWaste(); unsubWaste = null; }
      if (unsubEntries) { unsubEntries(); unsubEntries = null; }
      if (unsubSettings) { unsubSettings(); unsubSettings = null; }
      if (unsubLocations) { unsubLocations(); unsubLocations = null; }
    };

    // 特定OS(端末)で通信が単発で詰まり、読み込み画面から進まなくなる不具合の対策。
    // 一定時間で強制タイムアウトさせ、1回だけ裏で自動的に最初からやり直す。
    // それでもダメならエラー画面（再読み込み可能）に逃がす。
    function attemptStartup(attempt) {
      let currentStep = "サインイン中…";
      const markStep = (label) => { currentStep = label; setLoadingStep(label + (attempt > 1 ? `（${attempt}回目）` : "")); };

      let timeoutId = window.setTimeout(() => {
        timeoutId = null;
        if (cancelled) return;
        console.error(`startup timeout(attempt ${attempt}): 「${currentStep}」の段階でネットワーク処理が既定時間内に完了しませんでした`);
        unsubAll();
        if (attempt < 2) {
          // 1回目の失敗は自動で静かにやり直す（この端末で単発の通信詰まりが起きやすいため）
          attemptStartup(attempt + 1);
          return;
        }
        setFatalError(
          `通信に時間がかかっているため起動を中断しました（「${currentStep}」で停止／自動再試行後も失敗）。電波の良い場所で「再読み込み」をお試しください。（この端末・OSのバージョンで発生しやすい既知の症状です）`
        );
        setLoading(false);
      }, 15000);
      const clearStartupTimeout = () => {
        if (timeoutId) {
          window.clearTimeout(timeoutId);
          timeoutId = null;
        }
      };

      setLoadingStep(currentStep);
      ensureSignedIn()
        .then(() => {
          markStep("薬品データ取得中…");
          if (cancelled) return;

          // seedIfNeeded / syncExcelInventoryIfNeeded / fixEvansBlueFullStatusIfNeeded は
          // 「まだ完了していなければ一回だけ実行する」移行・初期化用の処理で、
          // 運用中の環境ではほぼ即return（何もしない）で終わるはずのもの。
          // 起動のたびにこれらを直列に待つと、途中のFirestore通信が1回でも
          // 詰まった場合にアプリ全体が起動不能になってしまうため、
          // 本体の初回データ取得はブロックさせず、裏で試すだけにする。
          seedIfNeeded()
            .then(() => syncExcelInventoryIfNeeded())
            .then(() => fixEvansBlueFullStatusIfNeeded())
            .then(() => autoBackupIfNeeded())
            .catch((err) => console.warn("起動時の初期化/移行チェックに失敗（本体表示には影響なし）:", err));

          unsubChem = db.collection("chemicals").onSnapshot(
            (snap) => {
              clearStartupTimeout();
              setChemicals(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
              setLoading(false);
            },
            (err) => {
              clearStartupTimeout();
              console.error("chemicals subscription error", err);
              if(!caesarRestIsQuotaError(err)) setFatalError("薬品データの取得に失敗しました：" + err.message);
              setLoading(false);
            }
          );
          unsubWaste = db.collection("wasteCategories").onSnapshot(
            (snap) => setWasteMeta(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
            (err) => {
              console.error("wasteCategories subscription error", err);
              if(!caesarRestIsQuotaError(err)) setFatalError("廃液分類データの取得に失敗しました：" + err.message);
            }
          );
          unsubEntries = db.collection("wasteEntries").onSnapshot(
            (snap) => setWasteEntriesRaw(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
            (err) => {
              console.error("wasteEntries subscription error", err);
              if(!caesarRestIsQuotaError(err)) setFatalError("廃液記録データの取得に失敗しました：" + err.message);
            }
          );
          unsubSettings = db.collection("meta").doc("settings").onSnapshot(
            (snap) => {
              if (snap.exists && snap.data().passcode) {
                setAdminPasscode(snap.data().passcode);
              }
            },
            (err) => console.error("settings subscription error", err)
          );
          // 「場所を追加」で作った、まだ薬品が無い保管場所を保持するコレクション
          unsubLocations = db.collection("locations").onSnapshot(
            (snap) => setLocationsMeta(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
            (err) => console.error("locations subscription error", err)
          );
        })
        .catch((err) => {
          clearStartupTimeout();
          console.error(`startup failed (attempt ${attempt})`, err);
          if (cancelled) return;
          if (attempt < 2) {
            attemptStartup(attempt + 1);
            return;
          }
          setFatalError("起動処理に失敗しました：" + (err.message || String(err)));
          setLoading(false);
        });
    }

    attemptStartup(1);

    return () => {
      cancelled = true;
      unsubAll();
    };
  }, []);

  // 起動時のチェックだけだと「開きっぱなしのタブ」では次に誰かがアプリを開くまで
  // バックアップが作られない。AUTO_BACKUP_INTERVAL_MS（24時間）おきにも
  // チェックし直すことで、長時間開いたままのセッションでも定期的に残るようにする。
  useEffect(() => {
    const timer = setInterval(() => {
      autoBackupIfNeeded().catch((err) => console.warn("定期バックアップチェックに失敗:", err));
    }, AUTO_BACKUP_INTERVAL_MS);
    return () => clearInterval(timer);
  }, []);

  // wasteCategories（メタ情報）＋wasteEntries（投入記録）を、既存の画面コンポーネントが
  // 期待する「entries を内包したカテゴリ配列」の形に合成する
  const wasteCategories = useMemo(
    () => wasteMeta.map((w) => ({ ...w, entries: wasteEntriesRaw.filter((e) => e.wasteId === w.id) })),
    [wasteMeta, wasteEntriesRaw]
  );

  const current = stack[stack.length - 1];

  const push = (entry) => setStack((s) => [...s, entry]);
  const pop = () => setStack((s) => (s.length > 1 ? s.slice(0, -1) : s));
  const goHome = (tab) => {
    setStack([{ view: "home" }]);
    if (tab) setHomeTab(tab);
  };

  const handleSaveMass = async (chemId, remaining) => {
    const chem = chemicals.find((c) => c.id === chemId);
    if (!chem) return;
    const newAmount = Math.max(0, +remaining.toFixed(2));
    try{
      await withDbTimeout(db.collection("chemicals").doc(chemId).update({ "stock.amount": newAmount }), "saveMass-update-timeout");
    }catch(e){ toastFail("残量の保存", e); }
  };

  // 未登録（重量不明）の薬品を「在庫なし」として確定させる。他に同名の在庫が無い時だけ使える簡易操作。
  const handleMarkNoStock = async (chem) => {
    if (typeof window !== "undefined" && window.confirm) {
      if (!window.confirm(`「${chem.name}」を在庫なし（空）として記録しますか？`)) return;
    }
    try{
      await withDbTimeout(db.collection("chemicals").doc(chem.id).update({
        stock: { amount: 0, capacity: 0, unit: "g", known: true, status: "empty" },
      }), "markNoStock-update-timeout");
    }catch(e){ toastFail("在庫なしの記録", e); }
  };

  // 薬品一覧をExcelファイル（.xlsx）として書き出す。棚卸・監査などアプリの外で使いたい時用。
  const handleExportExcel = () => {
    try {
      const rows = chemicals.map((c) => {
        const status = autoStatus(c.stock);
        const waste = wasteCategories.find((w) => w.id === c.wasteId);
        return {
          薬品名: c.name,
          分子式: c.formula || "",
          "CASナンバー": (c.cas && c.cas.trim()) || CAS_LOOKUP[c.name] || "",
          保管場所: displayLocationName(c.location?.name || ""),
          場所補足: c.subLocation || "",
          "在庫量(g)": c.stock && c.stock.known !== false ? c.stock.amount : "",
          状態: STATUS_META[status] ? STATUS_META[status].label : "",
          開封日: c.openDate || "",
          廃液分類: waste ? `${waste.code} ${waste.name}` : "",
          備考: c.purpose || "",
        };
      });
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [
        { wch: 26 }, { wch: 20 }, { wch: 14 }, { wch: 12 }, { wch: 10 },
        { wch: 10 }, { wch: 8 }, { wch: 12 }, { wch: 16 }, { wch: 24 },
      ];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "薬品一覧");
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, "0");
      const d = String(today.getDate()).padStart(2, "0");
      XLSX.writeFile(wb, `薬品一覧_${y}${m}${d}.xlsx`);
    } catch (e) {
      toastFail("薬品一覧のエクスポート", e);
    }
  };

  // 復元（管理者専用）：過去のバックアップから内容を選んで復元する。誤操作防止のため、
  // 実行前に管理者パスコードの入力を要求する。
  const handleRestoreRequest = () => {
    setPasscodeGate({
      title: "管理者確認",
      message: "過去のバックアップから復元するには、管理者パスコードを入力してください。",
      onCancel: () => setPasscodeGate(null),
      onConfirm: () => {
        setPasscodeGate(null);
        push({ view: "restoreList" });
      },
    });
  };

  const handleRunRestore = async (backupId) => {
    try {
      await restoreFromBackup(backupId);
      showToast("バックアップから復元しました");
      goHome("search");
    } catch (e) {
      toastFail("バックアップからの復元", e);
    }
  };

  const resolveLocation = (rawName) => {
    const trimmedName = rawName.trim();
    const existingFromChem = chemicals.find((c) => c.location.name.trim() === trimmedName)?.location;
    const existingFromLoc = locationsMeta.find((l) => (l.name || "").trim() === trimmedName);
    return (
      existingFromChem ||
      (existingFromLoc
        ? { id: existingFromLoc.id, name: existingFromLoc.name, note: existingFromLoc.note || "" }
        : { id: slugify(trimmedName), name: trimmedName, note: "" })
    );
  };

  const handleAddChemical = async ({ name, formula, cas, locationName, subLocation, amount, isFull, purpose, wasteId, openDate }) => {
    const location = resolveLocation(locationName);
    const newId = "c_" + Date.now();
    const stock = isFull ? { amount: 0, capacity: 0, unit: "g", known: false, status: "full" } : { amount, capacity: 0, unit: "g", known: true };
    try{
      await withDbTimeout(db
        .collection("chemicals")
        .doc(newId)
        .set({ name, formula: formula || "", cas: cas || "", location, subLocation: subLocation || "", stock, purpose: purpose || "", wasteId: wasteId || null, openDate: openDate || "" }), "addChemical-set-timeout");
      pop();
    }catch(e){ toastFail("薬品の追加", e); }
  };

  const handleEditChemical = async (chem, { name, formula, cas, locationName, subLocation, wasteId, stock, purpose, openDate }) => {
    const updates = {
      name: (name || chem.name || "").trim(),
      formula: formula || "",
      cas: cas || "",
      location: resolveLocation(locationName || chem.location.name),
      subLocation: subLocation || "",
      wasteId: wasteId || null,
      purpose: purpose || "",
      openDate: openDate || "",
    };
    if (stock) updates.stock = stock;
    try{
      await withDbTimeout(db.collection("chemicals").doc(chem.id).update(updates), "editChemical-update-timeout");
      pop();
    }catch(e){ toastFail("薬品情報の保存", e); }
  };

  const handleEditLocation = async (location, { name, note }) => {
    // 表記ゆれ（「冷蔵庫１」「冷蔵庫 1」等）で分かれている薬品・場所も、
    // 正規化した名前が一致するものはまとめて同じ内容で保存する
    const canonName = canonicalLocationName(location.name);
    const targetChemicals = chemicals.filter((c) => canonicalLocationName(c.location.name) === canonName);
    const batch = db.batch();
    const touchedLocationIds = new Set([location.id]);
    targetChemicals.forEach((c) => {
      batch.update(db.collection("chemicals").doc(c.id), {
        "location.name": name,
        "location.note": note,
      });
      touchedLocationIds.add(c.location.id);
    });
    // 薬品がまだ無い場所（「場所を追加」で作った場所）の名前・補足もここで一緒に保存する
    touchedLocationIds.forEach((id) => {
      batch.set(db.collection("locations").doc(id), { name, note }, { merge: true });
    });
    try{
      await withDbTimeout(batch.commit(), "editLocation-commit-timeout");
      pop();
    }catch(e){ toastFail("場所情報の保存", e); }
  };

  const handleAddLocation = async ({ name, note }) => {
    const id = slugify(name);
    const maxOrder = Math.max(-1, ...locationsMeta.map((l) => (typeof l.order === "number" ? l.order : -1)));
    try{
      await withDbTimeout(db.collection("locations").doc(id).set({ name, note: note || "", order: maxOrder + 1 }), "addLocation-set-timeout");
      goHome("location");
    }catch(e){ toastFail("場所の追加", e); }
  };

  const handleDeleteChemical = async (chem) => {
    if (typeof window !== "undefined" && window.confirm) {
      if (!window.confirm(`「${chem.name}」を薬品一覧から削除しますか？`)) return;
    }
    try{
      await withDbTimeout(db.collection("chemicals").doc(chem.id).delete(), "deleteChemical-delete-timeout");
      pop();
    }catch(e){ toastFail("薬品の削除", e); }
  };

  const handleAddWasteEntry = async (wasteId, entry) => {
    const { id, ...rest } = entry;
    try{
      await withDbTimeout(db.collection("wasteEntries").doc(id).set({ wasteId, ...rest }), "addWasteEntry-set-timeout");
      const cat = wasteMeta.find((w) => w.id === wasteId);
      if (cat && !cat.tankStartDate) {
        await withDbTimeout(db.collection("wasteCategories").doc(wasteId).update({ tankStartDate: entry.date }), "addWasteEntry-updateTankStart-timeout");
      }
      pop();
    }catch(e){ toastFail("投入記録の保存", e); }
  };

  const handleDeleteWasteEntry = async (wasteId, entry) => {
    if (typeof window !== "undefined" && window.confirm) {
      if (!window.confirm(`${entry.date}・${entry.personName}の記録（${entry.substanceName}）を削除しますか？`)) return;
    }
    try{
      await withDbTimeout(db.collection("wasteEntries").doc(entry.id).delete(), "deleteWasteEntry-delete-timeout");
      pop();
    }catch(e){ toastFail("投入記録の削除", e); }
  };
     
const handleDisposeWaste = (waste) => {
  // この分類（同じwasteId）を使っている薬品を数えて、確認メッセージに反映する
  const linkedChemicals = chemicals.filter((c) => c.wasteId === waste.id);
  const linkedNote = linkedChemicals.length > 0
    ? `\n\nこの分類を使っている薬品（${linkedChemicals.length}件）は、自動的に新しく発行するタンクへ付け替えられます。`
    : "";

  setPasscodeGate({
    title: "処分済みへの変更",
    message: `「${waste.code} ${waste.name}」のタンクを処分済みにします。\nこの操作の後は編集ができなくなります。同じ分類の新しいタンクを自動で発行します。${linkedNote}`,
    onCancel: () => setPasscodeGate(null),
    onConfirm: async () => {
      const newId = "w_" + Date.now();
      const batch = db.batch();

      // 1) 古いタンクを処分済みにする
      batch.update(db.collection("wasteCategories").doc(waste.id), {
        disposed: true,
        disposedAt: new Date().toISOString().slice(0, 10),
      });

      // 2) 同じ分類（コード・名称・色・処分方法）で新しいタンクを発行する
      batch.set(db.collection("wasteCategories").doc(newId), {
        code: waste.code,
        name: waste.name,
        note: waste.note || "",
        color: waste.color,
        disposal: waste.disposal || DISPOSAL_POLICY,
        tankStartDate: null,
      });

      // 3) この分類を使っていた薬品を、まとめて新タンクへ付け替える
      linkedChemicals.forEach((c) => {
        batch.update(db.collection("chemicals").doc(c.id), {
          wasteId: newId,
          wasteLabel: { code: waste.code, name: waste.name },
        });
      });

      try{
        await withDbTimeout(batch.commit(), "disposeWaste-commit-timeout");
        setPasscodeGate(null);
        goHome("waste");
      }catch(e){
        setPasscodeGate(null);
        toastFail("処分済みへの変更", e);
      }
    },
  });
};

const handleAddWasteCategory = ({ code, name, note, color }) => {
  setPasscodeGate({
    title: "タンクの新規追加",
    message: `次の廃液タンクを新規追加します。\n\n${code} ${name}`,
    onCancel: () => setPasscodeGate(null),
    onConfirm: async () => {
      const newId = "w_" + Date.now();
      try{
        await withDbTimeout(db.collection("wasteCategories").doc(newId).set({
          code,
          name,
          note,
          color,
          disposal: DISPOSAL_POLICY,
          tankStartDate: null,
        }), "addWasteCategory-set-timeout");
        setPasscodeGate(null);
        goHome("waste");
      }catch(e){
        setPasscodeGate(null);
        toastFail("タンクの新規追加", e);
      }
    },
  });
};

const handleOpenChangePasscode = () => {
  setPasscodeGate({
    title: "本人確認",
    message: "パスコードを変更するには、現在のパスコードを入力してください。",
    onCancel: () => setPasscodeGate(null),
    onConfirm: () => {
      setPasscodeGate(null);
      push({ view: "changePasscode" });
    },
  });
};

const handleSavePasscode = async (newPasscode) => {
  try{
    await withDbTimeout(db.collection("meta").doc("settings").set({ passcode: newPasscode }, { merge: true }), "savePasscode-set-timeout");
    goHome("waste");
  }catch(e){ toastFail("パスコードの変更", e); }
};

const handleDeleteWasteCategories = (wastes) => {
  if (!wastes || wastes.length === 0) return Promise.resolve(false);
  return new Promise((resolve) => {
    const names = wastes.map((w) => `・${w.code} ${w.name}`).join("\n");
    setPasscodeGate({
      title: "アーカイブの削除",
      message: `次のタンクをアーカイブから完全に削除します。\n投入記録もすべて削除され、元に戻せません。\n\n${names}`,
      onCancel: () => {
        setPasscodeGate(null);
        resolve(false);
      },
      onConfirm: async () => {
        const batch = db.batch();
        wastes.forEach((w) => {
          batch.delete(db.collection("wasteCategories").doc(w.id));
          w.entries.forEach((e) => batch.delete(db.collection("wasteEntries").doc(e.id)));
        });
        try{
          await withDbTimeout(batch.commit(), "deleteWasteCategories-commit-timeout");
          setPasscodeGate(null);
          resolve(true);
        }catch(e){
          setPasscodeGate(null);
          toastFail("アーカイブの削除", e);
          resolve(false);
        }
      },
    });
  });
};
     
  const findChem = (id) => chemicals.find((c) => c.id === id);

          </div>

          >
            再読み込み
          </button>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{ fontFamily: "'Inter', sans-serif", background: C.bg, minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>

  }

      <style>{FONT_IMPORT}</style>

        {current.view === "home" && (
          <>
<TopBar

    <img

      alt="CAESAR 薬品・廃液管理システム"
      style={{

      >

      </button>
      <button
        onClick={toggleTheme}
        aria-label="ダークモード切替"
        style={{ border: "none", background: "rgba(255,255,255,.14)", color: HEADER.text, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", width: 32, height: 32, borderRadius: 999, padding: 0, flex: "0 0 auto", fontSize: 14 }}
      >
        {theme === "dark" ? "☀️" : "🌙"}
      </button>
    </div>
  }
/>

            <HazardStripe height={4} />

            <div style={{ display: "flex", gap: 6, padding: "12px 16px 0 16px" }}>
