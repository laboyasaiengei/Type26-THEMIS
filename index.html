<style>
  html, body { margin: 0; padding: 0; background: #EEF1EC; -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; font-variant-numeric: normal; }
  input, textarea { font-family: inherit; }
  #boot-error { display: none; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); } }
  @keyframes keyPress { 0% { transform: scale(1); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }
html[data-theme="dark"], html[data-theme="dark"] body { background: #12181A; }

  /* ダークモード切り替え演出用の"カーテン"。
     全要素（renderFormulaが1文字ずつ生成するspanを含む）を個別にアニメーション
     させる代わりに、この1枚だけをフェードさせて色の切り替わりを覆い隠す
     （iPhone Safariでのコマ落ち対策）。 */
  .theme-curtain{
    position: fixed; inset: 0; z-index: 99999;
    background: #EEF1EC;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }

  /* iPad・MacBookなど画面幅が広い端末で、スマホ幅に貼り付いて見えないようにする */
  .app-shell{
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
  }
  @media (min-width: 768px){
    .app-shell{ max-width: 900px; }
  }
  @media (min-width: 1100px){
    .app-shell{ max-width: 1080px; }
  }

  /* TopBarの背景だけ画面幅いっぱいに広げ、中身はapp-shellと同じ幅で揃える */
  .topbar-bleed{
    width: 100vw;
    margin-left: calc(50% - 50vw);
  }
  .topbar-inner{
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 768px){
    .topbar-inner{ max-width: 900px; }
  }
  @media (min-width: 1100px){
    .topbar-inner{ max-width: 1080px; }
  }
</style>
<script>

  document.documentElement.dataset.theme = 'light';

<!-- Reactが立ち上がる前に致命的なエラーが起きても、画面が真っ白にならないようにするための安全網。
     Reactのマウントに成功したら自動で非表示になる（下の script で消す）。 -->
<div id="boot-error" style="font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; background: #F6E4E1; border: 1px solid #B23B31; border-radius: 12px; color: #182524;">
  <strong>読み込みエラーが発生しました。</strong>
  <p id="boot-error-message" style="white-space: pre-wrap; word-break: break-word; font-size: 13px;"></p>
  <p style="font-size: 12px; color: #4E625E;">ブラウザの開発者ツール（コンソール）に詳細が出ています。ネットワーク接続や広告ブロッカーが原因で、React・Babel・Firebaseの読み込み自体に失敗している可能性があります。</p>
</div>
<div id="root"></div>
<div id="themeCurtain" class="theme-curtain"></div>

<script>
  window.addEventListener('error', function (e) {
    var box = document.getElementById('boot-error');
    var msg = document.getElementById('boot-error-message');
    if (box && msg && !document.getElementById('root').hasChildNodes()) {
      box.style.display = 'block';
      msg.textContent = (e.message || 'unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
    }
  });
</script>

/* ---- 保存・削除失敗時などに使う簡易トースト通知（React外のDOMに直接描画） ---- */
function showToast(msg, isError){
  let t = document.getElementById("themisToast");
  if(!t){
    t = document.createElement("div");
    t.id = "themisToast";
    t.style.cssText = [
      "position:fixed", "left:50%", "bottom:24px", "transform:translateX(-50%) translateY(20px)",
      "color:#fff", "padding:10px 18px", "border-radius:10px", "font-size:13px",
      "box-shadow:0 6px 20px rgba(0,0,0,.25)", "z-index:99999", "opacity:0",
      "transition:opacity .2s, transform .2s", "pointer-events:none", "max-width:88vw", "text-align:center"
    ].join(";");
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = isError ? (C.dangerDeep || "#B3261E") : (C.tealDeep || "#122A4E");
  t.style.opacity = "1";
  t.style.transform = "translateX(-50%) translateY(0)";
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>{
    t.style.opacity = "0";
    t.style.transform = "translateX(-50%) translateY(20px)";
  }, 2600);
}
/* 保存・削除操作の失敗理由を短く添えて表示する共通ヘルパー */
function errDetail(e){
  if(typeof navigator!=="undefined" && !navigator.onLine) return "オフラインです";
  if(e && e.code==="permission-denied") return "アクセス権限がありません";
  if(e && e.code) return e.code;
  if(e && e.message) return e.message;
  return "原因不明のエラー";
}
function toastFail(action, e){
  console.error(action, e);
  showToast(`${action}に失敗しました（${errDetail(e)}）`, true);
}

const CAESAR_REST_REFRESH_KEY = "caesarRestProductionRefreshToken";
const CAESAR_REST_BACKOFF_MS = [4000, 10000, 30000, 60000];
const CAESAR_REST_QUOTA_BACKOFF_MS = [60000, 120000, 300000, 900000];

let caesarRestIdToken = "";
let caesarRestRefreshToken = "";
let caesarRestAuthReady = false;
let caesarRestPollFailureCount = 0;
let caesarRestQuotaFailureCount = 0;
let caesarRestQuotaCooldownUntil = 0;

function caesarRestIsQuotaError(e){
  return !!(e && (
    e.httpStatus === 429 ||
    /HTTP 429|RESOURCE_EXHAUSTED|Quota exceeded/i.test(String(e.message || ""))
  ));
}
function caesarRestEnterQuotaCooldown(){
  // 同時に複数リクエストが429になっても、1回の事故で段階を何段も進めない。
  const remaining = Math.max(0, caesarRestQuotaCooldownUntil - Date.now());
  if(remaining > 0) return remaining;
  const idx = Math.min(caesarRestQuotaFailureCount, CAESAR_REST_QUOTA_BACKOFF_MS.length - 1);
  const wait = CAESAR_REST_QUOTA_BACKOFF_MS[idx];
  caesarRestQuotaFailureCount = Math.min(caesarRestQuotaFailureCount + 1, CAESAR_REST_QUOTA_BACKOFF_MS.length - 1);
  caesarRestQuotaCooldownUntil = Date.now() + wait;
  return wait;
}
function caesarRestQuotaDelayRemaining(){
  return Math.max(0, caesarRestQuotaCooldownUntil - Date.now());
}
function caesarRestClearQuotaCooldown(){
  caesarRestQuotaFailureCount = 0;
  caesarRestQuotaCooldownUntil = 0;
}

function caesarRestTimeout(promise, ms, label){
  let timer;
  return Promise.race([
    Promise.resolve(promise),
    new Promise((_, reject)=>{
      timer = setTimeout(()=>reject(Object.assign(new Error(label+"-timeout"), {isTimeout:true})), ms);
    })
  ]).finally(()=>clearTimeout(timer));
}

async function caesarRestAuthRequest(){
  const saved = localStorage.getItem(CAESAR_REST_REFRESH_KEY) || "";
  if(saved){
    try{
      const res = await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(firebaseConfig.apiKey)}`, {
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(saved),
        cache:"no-store"
      });
      const raw = await res.text();
      if(!res.ok) throw new Error(`REST Auth refresh HTTP ${res.status}: ${raw.slice(0,220)}`);
      const data = JSON.parse(raw);
      caesarRestIdToken = data.id_token || "";
      caesarRestRefreshToken = data.refresh_token || saved;
      if(!caesarRestIdToken) throw new Error("REST Auth refresh: ID token missing");
      localStorage.setItem(CAESAR_REST_REFRESH_KEY, caesarRestRefreshToken);
      caesarRestAuthReady = true;
      return true;
    }catch(e){
      localStorage.removeItem(CAESAR_REST_REFRESH_KEY);
    }
  }

  const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(firebaseConfig.apiKey)}`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({returnSecureToken:true}),
    cache:"no-store"
  });
  const raw = await res.text();
  if(!res.ok) throw new Error(`REST Auth signUp HTTP ${res.status}: ${raw.slice(0,220)}`);
  const data = JSON.parse(raw);
  caesarRestIdToken = data.idToken || "";
  caesarRestRefreshToken = data.refreshToken || "";
  if(!caesarRestIdToken) throw new Error("REST Auth signUp: ID token missing");
  if(caesarRestRefreshToken) localStorage.setItem(CAESAR_REST_REFRESH_KEY, caesarRestRefreshToken);
  caesarRestAuthReady = true;
  return true;
}

async function caesarGetAppCheckToken(){
  if(isAppCheckDisabledByUrl()) return "";
  if(!RECAPTCHA_ENTERPRISE_SITE_KEY || RECAPTCHA_ENTERPRISE_SITE_KEY === "PASTE_ENTERPRISE_SITE_KEY_HERE"){
    throw new Error("Enterprise site key is not configured");
  }
  const result = await caesarRestTimeout(firebase.appCheck().getToken(false), 10000, "appcheck-token");
  const token = result && result.token ? result.token : "";
  if(!token) throw new Error("App Check token missing");
  return token;
}

async function caesarRestHeaders(){
  if(!caesarRestIdToken) await caesarRestAuthRequest();
  const headers = {
    "Authorization": "Bearer " + caesarRestIdToken,
    "Content-Type": "application/json"

function caesarEncodeValue(v){

function caesarDecodeValue(v){

  if("integerValue" in v) return Number(v.integerValue);
  if("doubleValue" in v) return Number(v.doubleValue);
  if("stringValue" in v) return v.stringValue;
  if("timestampValue" in v) return v.timestampValue;
  if("arrayValue" in v) return ((v.arrayValue && v.arrayValue.values) || []).map(caesarDecodeValue);
  if("mapValue" in v){

  const orders = (sub.state && sub.state.orders) || [];
  if(orders.length){
    rows.sort((A,B)=>{
      const a=A.data(), b=B.data();
      for(const o of orders){
        let c=caesarRestCompareValues(caesarRestGetPath(a,o.field), caesarRestGetPath(b,o.field));
        if(String(o.dir||"asc").toLowerCase()==="desc") c=-c;
        if(c) return c;
      }
      return A.id.localeCompare(B.id);
    });
  }
  if(sub.state && sub.state.limit != null) rows = rows.slice(0, sub.state.limit);
  return { docs:rows, size:rows.length, empty:rows.length===0, forEach(cb){ rows.forEach(cb); } };
}
function caesarRestEmitQuerySub(sub){
  if(sub.stopped) return;
  try{ sub.onNext && sub.onNext(caesarRestSnapshotFromRecords(sub)); }
  catch(e){ console.error("CAESAR local subscription callback failed", e); }
}
function caesarRestEmitDocSub(sub){
  if(sub.stopped) return;
  try{ sub.onNext && sub.onNext(caesarRestPlainSnapshot(sub.ref, sub.exists, sub.data)); }
  catch(e){ console.error("CAESAR local document callback failed", e); }
}

async function caesarRestLoadQuerySub(sub, isInitial){
  if(sub.stopped) return;
  const quotaWait = caesarRestQuotaDelayRemaining();
  if(quotaWait > 0){
    const e = new Error(`Firestore quota cooldown active (${Math.ceil(quotaWait/1000)}s)`); e.httpStatus=429;
    if(isInitial){
      sub.retryTimer = setTimeout(()=>caesarRestLoadQuerySub(sub, true), quotaWait + 250);
    }
    throw e;
  }
  try{
    const snap = await caesarRunQuery(sub.collectionRef, sub.state);
    sub.records = new Map(snap.docs.map(d => [d.id, caesarRestDeepClone(d.data())]));
    sub.failure = 0;
    caesarRestPollFailureCount = 0;
    caesarRestClearQuotaCooldown();
    caesarRestEmitQuerySub(sub);
    return snap;
  }catch(e){
    if(caesarRestIsQuotaError(e)){
      const wait = caesarRestEnterQuotaCooldown();
      console.warn("CAESAR REST quota failsafe: HTTP 429; reads paused", wait, e);
      if(isInitial && !sub.stopped) sub.retryTimer = setTimeout(()=>caesarRestLoadQuerySub(sub, true), wait + 250);
    }else if(isInitial && !sub.stopped){
      sub.failure = Math.min((sub.failure||0)+1, CAESAR_REST_BACKOFF_MS.length-1);
      caesarRestPollFailureCount = sub.failure;
      const wait = CAESAR_REST_BACKOFF_MS[sub.failure];
      sub.retryTimer = setTimeout(()=>caesarRestLoadQuerySub(sub, true), wait);
    }
    if(isInitial) sub.onError && sub.onError(e);
    throw e;
  }
}
async function caesarRestLoadDocSub(sub, isInitial){
  if(sub.stopped) return;
  const quotaWait = caesarRestQuotaDelayRemaining();
  if(quotaWait > 0){
    const e = new Error(`Firestore quota cooldown active (${Math.ceil(quotaWait/1000)}s)`); e.httpStatus=429;
    if(isInitial) sub.retryTimer = setTimeout(()=>caesarRestLoadDocSub(sub, true), quotaWait + 250);
    throw e;
  }
  try{
    const snap = await sub.ref.get();
    sub.exists = snap.exists;
    sub.data = snap.exists ? caesarRestDeepClone(snap.data()) : null;
    sub.failure = 0;
    caesarRestClearQuotaCooldown();
    caesarRestEmitDocSub(sub);
    return snap;
  }catch(e){
    if(caesarRestIsQuotaError(e)){
      const wait = caesarRestEnterQuotaCooldown();
      console.warn("CAESAR REST quota failsafe: HTTP 429; reads paused", wait, e);
      if(isInitial && !sub.stopped) sub.retryTimer = setTimeout(()=>caesarRestLoadDocSub(sub, true), wait + 250);
    }else if(isInitial && !sub.stopped){
      sub.failure = Math.min((sub.failure||0)+1, CAESAR_REST_BACKOFF_MS.length-1);
      sub.retryTimer = setTimeout(()=>caesarRestLoadDocSub(sub, true), CAESAR_REST_BACKOFF_MS[sub.failure]);
    }
    if(isInitial) sub.onError && sub.onError(e);
    throw e;
  }
}

async function caesarRestRefreshAll(){
  const q = Array.from(caesarRestQuerySubscriptions).filter(s=>!s.stopped).map(s=>caesarRestLoadQuerySub(s, false));
  const d = Array.from(caesarRestDocSubscriptions).filter(s=>!s.stopped).map(s=>caesarRestLoadDocSub(s, false));
  const results = await Promise.allSettled([...q,...d]);
  const bad = results.find(r=>r.status==="rejected");
  if(bad) throw bad.reason;
  return results.length;
}

function caesarRestApplyCommittedWrites(writes){
  for(const w of (writes || [])){
    const name = w.update ? w.update.name : w.delete;
    const seg = caesarRestSegmentsFromDocName(name);
    if(seg.length < 2) continue;
    const docId = seg[seg.length-1];
    const collectionSeg = seg.slice(0,-1);
    const collectionKey = collectionSeg.join("/");
    const docKey = seg.join("/");
    const patch = w.update ? caesarDecodeDocument(w.update) : null;
    const isMerge = !!(w.update && w.updateMask);

    caesarRestQuerySubscriptions.forEach(sub=>{
      if(sub.stopped || sub.collectionRef._segments.join("/") !== collectionKey) return;
      if(w.delete){
        sub.records.delete(docId);
      }else{
        const prev = sub.records.get(docId);
        sub.records.set(docId, isMerge ? caesarRestDeepMerge(prev, patch) : caesarRestDeepClone(patch));
      }
      caesarRestEmitQuerySub(sub);
    });

    caesarRestDocSubscriptions.forEach(sub=>{
      if(sub.stopped || sub.ref._segments.join("/") !== docKey) return;
      if(w.delete){ sub.exists=false; sub.data=null; }
      else { sub.exists=true; sub.data=isMerge ? caesarRestDeepMerge(sub.data, patch) : caesarRestDeepClone(patch); }
      caesarRestEmitDocSub(sub);
    });
  }
}

function caesarQueryRef(collectionRef, state){
  const base = {
    orders:[...((state && state.orders) || [])],
    limit:state && state.limit != null ? state.limit : null
  };
  return {
    orderBy(field, dir){
      return caesarQueryRef(collectionRef, {...base, orders:[...base.orders, {field:String(field), dir:dir || "asc"}]});
    },
    limit(n){ return caesarQueryRef(collectionRef, {...base, limit:n}); },
    async get(){ return caesarRunQuery(collectionRef, base); },
    onSnapshot(onNext, onError){
      const sub = {collectionRef, state:base, onNext, onError, records:new Map(), stopped:false, failure:0, retryTimer:null};
      caesarRestQuerySubscriptions.add(sub);
      caesarRestLoadQuerySub(sub, true).catch(()=>{});
      return () => {
        sub.stopped=true;
        if(sub.retryTimer) clearTimeout(sub.retryTimer);
        caesarRestQuerySubscriptions.delete(sub);
      };
    }
  };
}

function caesarDocRef(segments){
  const ref = {
    _segments:segments,
    id:segments[segments.length - 1],
    async get(){ return caesarDocSnapshot(ref, await caesarGetRawDoc(segments)); },
    async set(data, opts){ return caesarCommit([caesarSetWrite(segments, data, !!(opts && opts.merge))]); },
    async update(data){ return caesarCommit([caesarSetWrite(segments, data, true)]); },
    async delete(){ return caesarCommit([caesarDeleteWrite(segments)]); },
    collection(name){ return caesarCollectionRef([...segments, String(name)], false); },
    onSnapshot(onNext, onError){
      const sub = {ref, onNext, onError, exists:false, data:null, stopped:false, failure:0, retryTimer:null};
      caesarRestDocSubscriptions.add(sub);
      caesarRestLoadDocSub(sub, true).catch(()=>{});
      return () => {
        sub.stopped=true;
        if(sub.retryTimer) clearTimeout(sub.retryTimer);
        caesarRestDocSubscriptions.delete(sub);
      };
    }
  };
  return ref;
}

function caesarCollectionRef(segments, topLevel){
  const ref = {
    _segments:segments,
    doc(id){
      const docId = id || caesarRandomId();
      return caesarDocRef([...segments, docId]);
    },
    async get(){ return caesarRunQuery(ref, {orders:[], limit:null}); },
    orderBy(field, dir){ return caesarQueryRef(ref, {orders:[{field:String(field), dir:dir || "asc"}], limit:null}); },
    limit(n){ return caesarQueryRef(ref, {orders:[], limit:n}); },
    onSnapshot(onNext, onError){ return caesarQueryRef(ref, {orders:[], limit:null}).onSnapshot(onNext, onError); }
  };
  return ref;
}

const caesarRestDb = {
  collection(name){
    return caesarCollectionRef([String(name)], true);
  },
  batch(){
    const writes = [];
    return {
      set(ref, data, opts){ writes.push(caesarSetWrite(ref._segments, data, !!(opts && opts.merge))); return this; },
      update(ref, data){ writes.push(caesarSetWrite(ref._segments, data, true)); return this; },
      delete(ref){ writes.push(caesarDeleteWrite(ref._segments)); return this; },
      async commit(){ return caesarCommit(writes); }
    };
  }
};

// 指定ms以内にpromiseが解決/拒否しなければ強制的にreject（timeout）する。
// SafariのIndexedDB実装には、Firestoreが内部で使う通信/永続化処理が
// 稀に永久にハングする既知の不具合があるため、個々のFirestore呼び出しは
// すべてこれで包み、一定時間で見切りをつけて呼び出し元の既存のtry/catch
// （エラートースト表示など）に処理を戻せるようにする。
function withTimeout(promise, ms, tag) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(Object.assign(new Error(tag || "timeout"), { isTimeout: true })), ms)),
  ]);
}
const FS_OP_TIMEOUT_MS = 8000;
function withDbTimeout(promise, tag) {
  return withTimeout(promise, FS_OP_TIMEOUT_MS, tag);
}

// Firestoreのルールを「ログイン済みのみ許可」にするための最低限のログイン。

async function seedIfNeeded() {
  const flagRef = db.collection("meta").doc("status");
  const flagSnap = await withDbTimeout(flagRef.get(), "seed-flag-get-timeout");
  if (flagSnap.exists) return;

  const batch = db.batch();

  initialChemicals.forEach((c) => {
    const { id, ...rest } = c;
    batch.set(db.collection("chemicals").doc(id), rest);
  });

  initialWasteCategories.forEach((w) => {
    const { id, entries, ...rest } = w;
    batch.set(db.collection("wasteCategories").doc(id), rest);
    entries.forEach((e) => {
      const { id: entryId, ...entryRest } = e;
      batch.set(db.collection("wasteEntries").doc(entryId), { wasteId: id, ...entryRest });
    });
  });

  batch.set(flagRef, { seeded: true });
  await withDbTimeout(batch.commit(), "seed-commit-timeout");
}

/* ------------------------------------------------------------------ */
/*  バックアップ／復元                                                   */
/*  「backups」コレクション配下に、実行時点の chemicals / wasteCategories /  */
/*  wasteEntries / locations / 設定 をまるごとコピーしたサブコレクションを作る。*/
/*  復元時はこれらを読み戻し、本体のコレクションを全削除してから書き戻す。       */
/* ------------------------------------------------------------------ */

const BACKUP_BATCH_SIZE = 400; // Firestoreの1バッチ上限(500)よりやや余裕を持たせる
const MAX_BACKUP_AGE_MS = 5 * 24 * 60 * 60 * 1000; // これより古い自動バックアップは削除する（5日）
const MAX_BACKUPS_KEPT = 200; // 万が一大量に溜まった場合の安全上限（手動分も含む・自動は上のage基準で先に間引かれる）
const AUTO_BACKUP_INTERVAL_MS = 24 * 60 * 60 * 1000; // 自動バックアップの最短間隔（24時間＝1日1回）

function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

// 「batchに1件積む処理」の配列を、上限件数ごとに分けて順番にcommitする
async function commitOpsInChunks(ops) {
  const chunks = chunkArray(ops, BACKUP_BATCH_SIZE);
  for (const chunk of chunks) {
    const batch = db.batch();
    chunk.forEach((apply) => apply(batch));
    await withDbTimeout(batch.commit(), "backupChunk-commit-timeout");
  }
}

// 取得済みのQuerySnapshotの内容を、そのままの id で別のコレクションに複製する
async function copyDocsInto(sourceDocs, targetCollectionRef) {
  const ops = sourceDocs.map((d) => (batch) => batch.set(targetCollectionRef.doc(d.id), d.data()));
  await commitOpsInChunks(ops);
}

// 指定コレクションの中身を全件削除する（サブコレクション・本体どちらにも使う）
async function deleteAllInCollection(collectionRef) {
  const snap = await withDbTimeout(collectionRef.get(), "deleteAllInCollection-get-timeout");
  const ops = snap.docs.map((d) => (batch) => batch.delete(d.ref));
  await commitOpsInChunks(ops);
}

// 現在のデータ一式をスナップショットとして「backups」コレクションへ保存する。
// type: "auto"（自動・1日1回）｜ "manual"（管理者が手動で作成）
async function createBackupSnapshot(type) {
  const [chemSnap, wasteSnap, entriesSnap, locSnap, settingsSnap] = await Promise.all([
    withDbTimeout(db.collection("chemicals").get(), "backupSnapshot-chemicals-get-timeout"),
    withDbTimeout(db.collection("wasteCategories").get(), "backupSnapshot-wasteCategories-get-timeout"),
    withDbTimeout(db.collection("wasteEntries").get(), "backupSnapshot-wasteEntries-get-timeout"),
    withDbTimeout(db.collection("locations").get(), "backupSnapshot-locations-get-timeout"),
    withDbTimeout(db.collection("meta").doc("settings").get(), "backupSnapshot-settings-get-timeout"),
  ]);

  const backupRef = db.collection("backups").doc();
  await withDbTimeout(backupRef.set({
    createdAt: new Date().toISOString(),
    type,
    counts: {
      chemicals: chemSnap.size,
      wasteCategories: wasteSnap.size,
      wasteEntries: entriesSnap.size,
      locations: locSnap.size,
    },
    settings: settingsSnap.exists ? settingsSnap.data() : {},
  }), "backupSnapshot-set-timeout");

  await copyDocsInto(chemSnap.docs, backupRef.collection("chemicals"));
  await copyDocsInto(wasteSnap.docs, backupRef.collection("wasteCategories"));
  await copyDocsInto(entriesSnap.docs, backupRef.collection("wasteEntries"));
  await copyDocsInto(locSnap.docs, backupRef.collection("locations"));

  return backupRef.id;
}

// 古いバックアップを削除する。
// 基本方針：MAX_BACKUP_AGE_MS（5日）より古いものは削除。
// ただし何があっても直近1件は必ず残す。
// さらに、何らかの理由で件数が異常に膨らんだ場合に備えて MAX_BACKUPS_KEPT を安全上限として併用する。
async function rotateOldBackups() {
  const snap = await withDbTimeout(db.collection("backups").orderBy("createdAt", "asc").get(), "rotateBackups-get-timeout");
  const docs = snap.docs;
  if (docs.length <= 1) return;

  const cutoff = Date.now() - MAX_BACKUP_AGE_MS;
  let toRemove = docs.filter((d) => {
    const createdAt = d.data().createdAt;
    const t = createdAt ? new Date(createdAt).getTime() : 0;
    return t < cutoff;
  });
  // 直近1件は消さない（万一すべてが古い場合の保険）
  const newest = docs[docs.length - 1];
  toRemove = toRemove.filter((d) => d.id !== newest.id);

  // 年齢基準の削除後もなお件数が安全上限を超える場合は、古い順にさらに間引く
  const remainingCount = docs.length - toRemove.length;
  if (remainingCount > MAX_BACKUPS_KEPT) {
    const removeIds = new Set(toRemove.map((d) => d.id));
    const survivors = docs.filter((d) => !removeIds.has(d.id));
    const extraToRemove = survivors.slice(0, survivors.length - MAX_BACKUPS_KEPT);
    toRemove = toRemove.concat(extraToRemove);
  }

  for (const doc of toRemove) {
    await deleteAllInCollection(doc.ref.collection("chemicals"));
    await deleteAllInCollection(doc.ref.collection("wasteCategories"));
    await deleteAllInCollection(doc.ref.collection("wasteEntries"));
    await deleteAllInCollection(doc.ref.collection("locations"));
    await withDbTimeout(doc.ref.delete(), "rotateBackups-delete-timeout");
  }
}

// 前回の自動バックアップから一定時間（1時間）経っていれば新しくバックアップを作る。
// アプリ起動時に加えて、開きっぱなしのセッション中も定期的に呼び出される。
async function autoBackupIfNeeded() {
  const stateRef = db.collection("meta").doc("backupState");
  const stateSnap = await withDbTimeout(stateRef.get(), "autoBackupState-get-timeout");
  const last = stateSnap.exists ? stateSnap.data().lastAutoBackupAt : null;
  if (last && Date.now() - new Date(last).getTime() < AUTO_BACKUP_INTERVAL_MS) return;
  await createBackupSnapshot("auto");
  await withDbTimeout(stateRef.set({ lastAutoBackupAt: new Date().toISOString() }, { merge: true }), "autoBackupState-set-timeout");
  await rotateOldBackups();
}

// 指定したバックアップの内容で、現在のデータを完全に置き換える（元に戻せない操作）
async function restoreFromBackup(backupId) {
  const backupRef = db.collection("backups").doc(backupId);
  const [backupDoc, chemSnap, wasteSnap, entriesSnap, locSnap] = await Promise.all([
    withDbTimeout(backupRef.get(), "restore-meta-get-timeout"),
    withDbTimeout(backupRef.collection("chemicals").get(), "restore-chemicals-get-timeout"),
    withDbTimeout(backupRef.collection("wasteCategories").get(), "restore-wasteCategories-get-timeout"),
    withDbTimeout(backupRef.collection("wasteEntries").get(), "restore-wasteEntries-get-timeout"),
    withDbTimeout(backupRef.collection("locations").get(), "restore-locations-get-timeout"),
  ]);
  if (!backupDoc.exists) throw new Error("指定されたバックアップが見つかりません");

  await deleteAllInCollection(db.collection("chemicals"));
  await deleteAllInCollection(db.collection("wasteCategories"));
  await deleteAllInCollection(db.collection("wasteEntries"));
  await deleteAllInCollection(db.collection("locations"));

  await copyDocsInto(chemSnap.docs, db.collection("chemicals"));
  await copyDocsInto(wasteSnap.docs, db.collection("wasteCategories"));
  await copyDocsInto(entriesSnap.docs, db.collection("wasteEntries"));
  await copyDocsInto(locSnap.docs, db.collection("locations"));

  const settings = backupDoc.data().settings;
  if (settings && settings.passcode) {
    await withDbTimeout(db.collection("meta").doc("settings").set({ passcode: settings.passcode }, { merge: true }), "restore-passcode-set-timeout");
  }
}

// バックアップの日時をアプリ内表示用に整形する
function formatBackupDate(iso) {
  const d = iso ? new Date(iso) : null;
  if (!d || isNaN(d.getTime())) return "日時不明";
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  const hh = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  return `${y}/${m}/${day} ${hh}:${mi}`;
}

// 化学式・物質名を表示用に整形する。
// 元素記号や閉じ括弧の直後の数字＝下付き（原子数）。
// それ以外（文字列の先頭・「・」の直後など）の数字＝水和物の係数などなので
// 通常サイズのまま（例：Cu(NO3)2・3H2O → Cu(NO₃)₂・3H₂O の「3」は下付きにしない）。
// 元素記号・閉じ括弧の直後の数字＝原子数（下付き）。
// 文字列先頭・「・」直後・スペース直後の数字＝水和物係数やモル比などの通常数字。
// 上付き（イオン価数 2+ / 3- など）にも対応。
// <sub>タグそのままだと視認性が低いので、独自のスタイル付きspanで表示する。
function renderFormula(text) {
  const nodes = [];
  let i = 0;
  while (i < text.length) {
    const ch = text[i];

    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < text.length && /[0-9]/.test(text[j])) j++;
      const run = text.slice(i, j);
      const prevChar = i > 0 ? text[i - 1] : null;
      const nextChar = j < text.length ? text[j] : null;
      const isChargeSuperscript = nextChar === "+" || nextChar === "-" || nextChar === "−";
      const isSubscript = !!prevChar && /[A-Za-z)\]]/.test(prevChar) && !isChargeSuperscript;

      if (isSubscript) {
        nodes.push(
          <span key={i} style={{ fontSize: "0.76em", verticalAlign: "-0.32em", fontWeight: 700 }}>
            {run}
          </span>
        );
      } else {
        nodes.push(<span key={i} style={{ fontWeight: 600 }}>{run}</span>);
      }
      i = j;
    } else if (ch === "+" || ch === "-" || ch === "−") {
      // イオン価数などの符号（数字の直後）は上付きで表示
      const prevChar = i > 0 ? text[i - 1] : null;
      const isCharge = !!prevChar && /[0-9]/.test(prevChar);
      nodes.push(
        <span
          key={i}
          style={isCharge ? { fontSize: "0.76em", verticalAlign: "0.55em", fontWeight: 700 } : { fontWeight: 600 }}
        >
          {ch}
        </span>
      );
      i++;
    } else if (ch === "・" || ch === "·" || ch === ".") {
      // 水和物の中点は埋もれやすいので、少し余白を足して見やすくする
      nodes.push(
        <span key={i} style={{ margin: "0 1.5px", fontWeight: 700 }}>
          {ch}
        </span>
      );
      i++;
    } else {
      nodes.push(<span key={i} style={{ fontWeight: 600 }}>{ch}</span>);
      i++;
    }
  }
  return nodes;
}

function stockRatio(stock) {
  return stock.capacity > 0 ? stock.amount / stock.capacity : 0;
}

function barColor(stock) {
  const r = stockRatio(stock);
  if (r <= 0.15) return C.danger;
  if (r <= 0.4) return C.amberDeep;
  return C.teal;
}

const STATUS_META = {
  full: { label: "FULL", sub: "未開封", color: C.tealDeep, bg: C.okBg },
  in_use: { label: "使用中", sub: "開封済み", color: C.ink, bg: "#E7EAE5" },
  empty: { label: "空", sub: "廃棄待ち", color: C.danger, bg: C.dangerBg },
  unknown: { label: "未登録", sub: "在庫量不明", color: C.inkSoft, bg: C.lockBg },
};

function autoStatus(stock) {
  if (!stock) return "unknown";
  if (stock.known === false) return stock.status || "unknown";
  if (stock.amount <= 0) return "empty";
  if (stock.capacity > 0 && stock.amount >= stock.capacity) return "full";
  return "in_use";
}

// 在庫量の少ない順に並べるためのソート用の値。
// 重量が未登録（known===false）のものは値が分からないので、常に一番下に回す。
function stockSortValue(stock) {
  if (!stock || stock.known === false) return Infinity;
  return stock.amount;
}

// 検索・場所案内などで在庫量（g）を1行で表示するための文字列。
function stockAmountLabel(stock) {
  const status = autoStatus(stock);

}

// 保管場所が「場所未設定」など、まだきちんと登録されていないかどうか。
function isLocationUnregistered(location) {
  const name = (location && location.name ? location.name : "").trim();
  return name === "" || name === "場所未設定";
}
// タンク使用開始日から数えた経過日数。未設定なら null。
function daysSinceTankStart(tankStartDate) {
  if (!tankStartDate) return null;
  const start = new Date(tankStartDate + "T00:00:00");
  const diffMs = Date.now() - start.getTime();
  return Math.floor(diffMs / 86400000);
}

// 使用開始から1年(365日)を迎える1ヶ月(30日)前を切ったら注意表示にする
function isTankAgeWarning(waste) {
  if (!waste || waste.disposed || !waste.tankStartDate) return false;
  const days = daysSinceTankStart(waste.tankStartDate);
  return days !== null && days >= 335;
}

// タンクの容量（20L=20000mL）
const TANK_CAPACITY_ML = 20000;
const TANK_CAPACITY_L = TANK_CAPACITY_ML / 1000;

// タンク使用開始日から「交換目安日」（使用開始から1年後）を算出する。未設定ならnull。
function tankReplaceDate(tankStartDate) {
  if (!tankStartDate) return null;
  const start = new Date(tankStartDate + "T00:00:00");
  const replace = new Date(start.getTime() + 365 * 86400000);
  const y = replace.getFullYear();
  const m = String(replace.getMonth() + 1).padStart(2, "0");
  const d = String(replace.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// 今日の日付を YYYY-MM-DD 形式で返す（date input の value 用）
function todayDateStr() {
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth() + 1).padStart(2, "0");
  const d = String(today.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

// mL表記だと分かりづらいのでL表記（小数第2位まで）に変換する
function mlToL(volumeMl) {
  return Math.round((volumeMl / 1000) * 100) / 100;
}
     
// 濃度(g/L)を直接入力した記録の集合から、合計使用量・合成濃度(g/L)を算出する
// ※必ず「同じ薬品(substanceName)」の記録同士に対して使うこと
function summarizeEntries(entries) {
  let totalVolumeMl = 0;
  let totalMassG = 0;
  entries.forEach((e) => {
    const massG = e.concentrationGL * (e.volumeMl / 1000);
    totalVolumeMl += e.volumeMl;
    totalMassG += massG;
  });
  const aggregateGL = totalVolumeMl > 0 ? totalMassG / (totalVolumeMl / 1000) : 0;
  return {
    totalVolumeMl: Math.round(totalVolumeMl * 100) / 100,
    aggregateGL: Math.round(aggregateGL * 1000) / 1000,
  };
}

// 場所名の表記ゆれを吸収する（Excelインポート時の「冷蔵庫１」「冷蔵庫 1」等をまとめる）
function canonicalLocationName(name) {
  const n = (name || "").trim();
  if (n === "冷蔵庫１" || n === "冷蔵庫 1") return "冷蔵庫1";
  if (n === "冷蔵庫②" || n === "冷蔵庫 ②") return "冷蔵庫2";
  return n;
}

// Excelインポート時に自動で付いた定型メモは表示上不要なので消す
function cleanLocationNote(note) {

}

// 場所の選択肢（実験室の棚・ドラフト・冷蔵庫の物理配置に対応）
const LOCATION_OPTIONS = [
  "1-1", "1-2", "1-3", "1-4", "1-5", "1-6",
  "2",
  "3-1", "3-2", "3-3",
  "4-1", "4-2", "4-3", "4-4", "4-5",
  "5-1", "5-2", "5-3", "5-4",
  "冷蔵庫１", "冷蔵庫②",
];

// 保管場所名が「数字-数字」の形式（例：1-1〜1-6）なら、先頭の数字を返す。
// それ以外（冷蔵庫1など）はnullを返し、グループ化の対象外とする。
function locationGroupPrefix(name) {
  const m = /^(\d+)-\d+$/.exec(canonicalLocationName(name || "").trim());
  return m ? m[1] : null;
}

// 表示名を組み立てる。数字だけの場所（例：「2」）は「場所2」と表示する。
// 「1-1」などの区画名はそのまま表示する（親カードのほうは別途「場所1」にする）。
function displayLocationName(name) {
  const canon = canonicalLocationName(name);
  if (/^\d+$/.test(canon)) return `場所${canon}`;
  return canon;
}

// 並び順を決めるためのラベル。「1-1」などの区画も親グループと同じ「場所1」扱いにする。
function locationRankLabel(name) {
  const canon = canonicalLocationName(name);
  const dashMatch = /^(\d+)-\d+$/.exec(canon);
  if (dashMatch) return `場所${dashMatch[1]}`;
  if (/^\d+$/.test(canon)) return `場所${canon}`;
  return canon;
}

// 保管場所一覧の並び順：場所1〜5 → 冷蔵庫1・2 → 465冷蔵庫 → 465/466実験室 → 場所未設定 → その他
const LOCATION_DISPLAY_ORDER = ["場所1", "場所2", "場所3", "場所4", "場所5", "冷蔵庫1", "冷蔵庫2", "465冷蔵庫", "465実験室", "466実験室", "場所未設定"];
function locationSortRank(name) {
  const idx = LOCATION_DISPLAY_ORDER.indexOf(locationRankLabel(name));
  return idx === -1 ? LOCATION_DISPLAY_ORDER.length : idx;
}

// 場所を集計する際のキー。「1-1」等の区画は区画ごとに個別のまま保つが、
// それ以外（冷蔵庫の表記ゆれ等）は正規化した名前でひとつにまとめる。
function locationMergeKey(loc) {
  const canon = canonicalLocationName(loc.name);
  if (/^\d+-\d+$/.test(canon)) return "id:" + loc.id;
  return "name:" + canon;
}

// タンク内の記録を薬品(substanceName)ごとにグループ化する
function groupBySubstance(entries) {
  const map = new Map();
  entries.forEach((e) => {
    if (!map.has(e.substanceName)) map.set(e.substanceName, []);
    map.get(e.substanceName).push(e);
  });
  return Array.from(map.entries()).map(([substanceName, list]) => ({
    substanceName,
    entries: list,
    summary: summarizeEntries(list),
  }));
}

// 廃液コードの並び替え（A→B、数字が小さい順。同じ番号内では強/有→弱/無の順）
function compareWasteCode(a, b) {
  const parse = (code) => {
    const m = code.match(/^([A-Za-z])-(\d+)(.*)$/);
    if (!m) return { letter: code, num: 0, suffix: "" };
    return { letter: m[1], num: parseInt(m[2], 10), suffix: m[3] || "" };
  };
  const suffixRank = { 強: 0, 有: 0, 弱: 1, 無: 1, "": 0, ホ: 2 };
  const pa = parse(a.code);
  const pb = parse(b.code);
  if (pa.letter !== pb.letter) return pa.letter < pb.letter ? -1 : 1;
  if (pa.num !== pb.num) return pa.num - pb.num;
  const ra = suffixRank[pa.suffix] ?? 9;
  const rb = suffixRank[pb.suffix] ?? 9;
  return ra - rb;
}

// 廃液コードの頭文字（A/B）でUIの配色を切り替える（A系統＝青、B系統＝赤）
function wasteAccent(code) {
  const isB = typeof code === "string" && code.trim().toUpperCase().startsWith("B");
  return {
    text: isB ? C.danger : C.teal,         // コードタグなど、地の色の上に乗せる文字色
    deep: isB ? C.dangerDeep : C.tealDeep, // バナー背景など、白文字を乗せる濃色
  };
}

function slugify(name) {

function PasscodeModal({ title, message, onCancel, onSubmit, correctPasscode }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState("");
  const [shake, setShake] = useState(false);
  const maxLen = 8;

  const triggerShake = (msg) => {
    setError(msg);
    setShake(true);
    setTimeout(() => {
      setShake(false);
      setValue("");
    }, 350);
  };

  const handleDigit = (d) => {
    if (value.length >= maxLen) return;
    const next = value + d;
    setValue(next);
    setError("");
    if (next.length >= (correctPasscode || "").length) {
      if (next === correctPasscode) {
        onSubmit();
      } else {
        triggerShake("パスコードが違います。");
      }
    }
  };

  const handleBackspace = () => {
    setValue((v) => v.slice(0, -1));
    setError("");
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(24,37,36,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 20 }}>
      <div style={{ background: C.paper, borderRadius: 16, padding: "20px 20px 26px", width: "100%", maxWidth: 340 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <Lock size={16} color={C.tealDeep} />
          <div style={{ fontWeight: 700, fontSize: 15, color: C.ink }}>{title}</div>
        </div>
        <div style={{ fontSize: 13, color: C.inkSoft, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{message}</div>

        <PinDots length={value.length} minSlots={Math.max(4, (correctPasscode || "").length)} shake={shake} />
        <div style={{ minHeight: 16, textAlign: "center", marginBottom: 10 }}>
          {error && <span style={{ fontSize: 12, color: C.danger }}>{error}</span>}
        </div>

        <NumericKeypad onDigit={handleDigit} onBackspace={handleBackspace} />

        <button
          onClick={onCancel}
          style={{ width: "100%", marginTop: 20, border: `1px solid ${C.line}`, background: "transparent", color: C.inkSoft, fontSize: 14, fontWeight: 600, borderRadius: 10, padding: "11px", cursor: "pointer" }}
        >
          キャンセル
        </button>
      </div>
    </div>
  );
}

function LocationTab({ chemicals, extraLocations, onOpenLocation, onOpenGroup, onAddLocation, onAddChemical }) {
  const locations = useMemo(() => {
    const map = new Map();
    chemicals.forEach((c) => {
      const key = locationMergeKey(c.location);
      if (!map.has(key)) {
        map.set(key, { ...c.location, name: canonicalLocationName(c.location.name), note: cleanLocationNote(c.location.note), items: [] });
      }
      map.get(key).items.push(c);
    });
    // まだ薬品が置かれていない、追加だけされた場所もここに合流させる
    (extraLocations || []).forEach((l) => {
      const key = locationMergeKey(l);
      if (!map.has(key)) map.set(key, { id: l.id, name: canonicalLocationName(l.name), note: cleanLocationNote(l.note), items: [] });
    });
    // 場所メタ情報(extraLocations)にorderがあれば、薬品由来の場所にもマージする
    const metaById = new Map((extraLocations || []).map((l) => [l.id, l]));
    const list = Array.from(map.values()).map((loc) => ({
      ...loc,
      order: typeof metaById.get(loc.id)?.order === "number" ? metaById.get(loc.id).order : null,
    }));
    list.sort((a, b) => {
      const ao = a.order === null ? Infinity : a.order;
      const bo = b.order === null ? Infinity : b.order;
      if (ao !== bo) return ao - bo;
      const ra = locationSortRank(a.name);
      const rb = locationSortRank(b.name);
      if (ra !== rb) return ra - rb;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });
    return list;
  }, [chemicals, extraLocations]);

  // 「1-1」「1-2」...のように先頭の数字が同じ場所は、ひとつの「場所◯」カードにまとめる。
  // 元の並び順（order／ランク順）はグループの挿入位置にそのまま引き継ぐ。
  const displayList = useMemo(() => {
    const groupMap = new Map();
    locations.forEach((loc) => {
      const prefix = locationGroupPrefix(loc.name);
      if (!prefix) return;
      if (!groupMap.has(prefix)) groupMap.set(prefix, []);
      groupMap.get(prefix).push(loc);
    });
    const seen = new Set();
    const result = [];
    locations.forEach((loc) => {
      const prefix = locationGroupPrefix(loc.name);
      if (!prefix) {
        result.push(loc);
        return;
      }
      if (seen.has(prefix)) return;
      seen.add(prefix);
      const subs = groupMap.get(prefix);
      result.push({
        id: "group:" + prefix,
        isGroup: true,
        name: prefix,
        note: `${subs.length}か所`,
        items: subs.flatMap((s) => s.items),
      });
    });
    return result;
  }, [locations]);

  return (
    <div style={{ padding: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8, gap: 8 }}>
        <SectionLabel>保管場所一覧</SectionLabel>
        <div style={{ display: "flex", gap: 8 }}>
          <button
            onClick={onAddChemical}
            style={{ border: "none", background: HEADER.bg, color: "#fff", fontSize: 12, fontWeight: 700, borderRadius: 8, padding: "7px 11px", cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}
          >
            <Plus size={13} /> 薬品を追加
          </button>
          <button
            onClick={onAddLocation}
            style={{ border: "none", background: HEADER.bg, color: "#fff", fontSize: 12, fontWeight: 700, borderRadius: 8, padding: "7px 11px", cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}
          >
            <Plus size={13} /> 場所を追加
          </button>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {displayList.map((loc, index) => (
          <div
            key={loc.id}
            style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12, padding: "13px 14px", display: "flex", alignItems: "center", gap: 10 }}
          >
            <button
              onClick={() => (loc.isGroup ? onOpenGroup(loc.name) : onOpenLocation(loc))}
              style={{ textAlign: "left", border: "none", background: "transparent", padding: 0, display: "flex", alignItems: "center", gap: 10, flex: 1, cursor: "pointer" }}
            >
              <div style={{ width: 34, height: 34, borderRadius: 9, background: C.okBg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                {loc.isGroup ? <Package size={16} color={C.tealDeep} /> : <MapPin size={16} color={C.tealDeep} />}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{loc.isGroup ? `場所${loc.name}` : displayLocationName(loc.name)}</div>
                <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 2 }}>
                  {loc.items.length}品目{loc.note ? `・${loc.note}` : ""}
                </div>
              </div>
              <Chevron />
            </button>
          </div>
        ))}
        {displayList.length === 0 && (
          <div style={{ textAlign: "center", color: C.inkSoft, fontSize: 13, padding: "40px 0" }}>
            保管場所がまだありません
          </div>
        )}
      </div>
    </div>
  );
}

function LocationGroupPage({ prefix, chemicals, extraLocations, onBack, onOpenLocation }) {

      map.get(c.location.id).items.push(c);
    });

      if (locationGroupPrefix(l.name) !== prefix) return;
      if (!map.has(l.id)) map.set(l.id, { id: l.id, name: l.name, note: cleanLocationNote(l.note), items: [] });

function InventoryTab({ chemicals, onEdit, onDelete }) {
  const PAGE_SIZE = 20;
  const [page, setPage] = useState(1);

  // 在庫量（重量）または保管場所のどちらかが未登録の薬品を対象にする。
  // ただし「FULL（未開封）」は重量こそ未計測だが状態としては登録済み（既知）なので、
  // known===false であっても status が "full" の場合はここでの「未登録」には含めない。
  const unregistered = useMemo(
    () =>
      chemicals
        .filter((c) => (c.stock?.known === false && c.stock?.status !== "full") || isLocationUnregistered(c.location))
        .sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)),
    [chemicals]
  );

  const totalPages = Math.max(1, Math.ceil(unregistered.length / PAGE_SIZE));

  // 削除などで件数が減ってページ数が減った場合、開いたままだと空ページになるので戻す
  useEffect(() => {
    if (page > totalPages) setPage(totalPages);
  }, [totalPages, page]);

  const pageItems = unregistered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  return (
    <div style={{ padding: 16 }}>
      <div style={{ marginBottom: 8 }}>
        <SectionLabel>在庫・場所が未登録の薬品（{unregistered.length}）</SectionLabel>
      </div>

      {unregistered.length === 0 && (
        <div style={{ textAlign: "center", padding: "48px 12px", color: C.inkSoft }}>
          <Package size={24} style={{ marginBottom: 10, opacity: 0.5 }} />
          <div style={{ fontSize: 14, lineHeight: 1.7 }}>
            在庫量・保管場所が未登録の薬品はありません
          </div>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {pageItems.map((c) => {
          const status = autoStatus(c.stock);
          const stockKnown = c.stock?.known !== false || c.stock?.status === "full";
          const locationUnregistered = isLocationUnregistered(c.location);
          return (
            <div key={c.id} style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{c.name}</div>
                  <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 3 }}>
                    {!stockKnown && locationUnregistered
                      ? "在庫量・保管場所とも未登録"
                      : !stockKnown
                      ? "在庫量が未登録"
                      : "保管場所が未登録"}
                  </div>
                </div>
                <AutoStatusBadge statusKey={status} size="small" />
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button
                  onClick={() => onEdit(c)}
                  style={{ flex: 1, border: "none", background: HEADER.bg, color: "#fff", fontSize: 12.5, fontWeight: 600, borderRadius: 8, padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}
                >
                  <Package size={13} /> 編集する
                </button>
                <button
                  onClick={() => onDelete(c)}
                  style={{ border: `1.5px solid ${C.danger}`, background: C.dangerBg, color: C.danger, fontSize: 12.5, fontWeight: 700, borderRadius: 8, padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}
                >
                  <Trash2 size={13} /> 削除
                </button>
              </div>
            </div>
          );
        })}
      </div>

      {totalPages > 1 && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, marginTop: 18 }}>
          <button
            onClick={() => setPage((p) => Math.max(1, p - 1))}
            disabled={page <= 1}
            style={{ border: `1.5px solid ${C.line}`, background: C.paper, color: C.ink, fontSize: 12.5, fontWeight: 700, borderRadius: 8, padding: "7px 12px", cursor: page <= 1 ? "not-allowed" : "pointer", opacity: page <= 1 ? 0.4 : 1 }}
          >
            前へ
          </button>
          <div style={{ fontSize: 12.5, color: C.inkSoft, fontFamily: "'Roboto Mono', monospace" }}>
            {page} / {totalPages}
          </div>
          <button
            onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
            disabled={page >= totalPages}
            style={{ border: `1.5px solid ${C.line}`, background: C.paper, color: C.ink, fontSize: 12.5, fontWeight: 700, borderRadius: 8, padding: "7px 12px", cursor: page >= totalPages ? "not-allowed" : "pointer", opacity: page >= totalPages ? 0.4 : 1 }}
          >
            次へ
          </button>
        </div>
      )}
    </div>
  );
}

function ChangePasscodePage({ onBack, onSave }) {
  const [step, setStep] = useState("enter"); // "enter" | "confirm"
  const [firstCode, setFirstCode] = useState("");
  const [value, setValue] = useState("");
  const [error, setError] = useState("");
  const [shake, setShake] = useState(false);
  const minLen = 4;
  const maxLen = 8;

  const triggerShake = (msg) => {
    setError(msg);
    setShake(true);
    setTimeout(() => setShake(false), 350);
  };

  const handleDigit = (d) => {
    if (value.length >= maxLen) return;
    setValue((v) => v + d);
    setError("");
  };

  const handleBackspace = () => {
    setValue((v) => v.slice(0, -1));
    setError("");
  };

  const handleConfirm = () => {
    if (value.length < minLen) {
      triggerShake(`${minLen}桁以上で入力してください。`);
      return;
    }
    if (step === "enter") {
      setFirstCode(value);
      setValue("");
      setError("");
      setStep("confirm");
    } else {
      if (value === firstCode) {
        onSave(value);
      } else {
        triggerShake("パスコードが一致しません。最初からやり直してください。");
        setTimeout(() => {
          setValue("");
          setFirstCode("");
          setStep("enter");
        }, 400);
      }
    }
  };

  return (
    <div>
      <TopBar title="パスコードの変更" onBack={onBack} />
      <div style={{ padding: 16 }}>
        <div style={{ textAlign: "center", marginTop: 16, fontSize: 14, fontWeight: 600, color: C.ink }}>
          {step === "enter" ? "新しいパスコードを入力" : "確認のためもう一度入力"}
        </div>
        <div style={{ textAlign: "center", fontSize: 11.5, color: C.inkSoft, marginTop: 4 }}>
          {minLen}〜{maxLen}桁の数字
        </div>

        <PinDots length={value.length} minSlots={minLen} shake={shake} />
        <div style={{ minHeight: 16, textAlign: "center", marginBottom: 6 }}>
          {error && <span style={{ fontSize: 12, color: C.danger }}>{error}</span>}
        </div>

        <NumericKeypad onDigit={handleDigit} onBackspace={handleBackspace} />

        <button
          onClick={handleConfirm}
          disabled={value.length < minLen}
          style={{ width: "100%", marginTop: 22, border: "none", background: value.length >= minLen ? HEADER.bg : "#B7C0BC", color: "#fff", fontSize: 15, fontWeight: 600, borderRadius: 12, padding: "13px", cursor: value.length >= minLen ? "pointer" : "not-allowed", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
        >
          {step === "enter" ? "次へ" : <><Save size={16} /> 変更を保存</>}
        </button>

        <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 16, textAlign: "center" }}>
          変更後は、処分・削除・新規タンク追加などすべての操作でこの新しいパスコードが必要になります。
        </div>
      </div>
    </div>
  );
}

/*  廃液タンク・アーカイブ一覧ページ（処分済みのタンクのみ表示）             */

const ARCHIVE_PAGE_SIZE = 20;

function WasteArchivePage({ wasteCategories, onBack, onOpenWaste, onDeleteWastes }) {
  const disposed = useMemo(
    () => [...wasteCategories].filter((w) => w.disposed).sort(compareWasteCode),
    [wasteCategories]
  );

  const [page, setPage] = useState(0);
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState(() => new Set());

  const totalPages = Math.max(1, Math.ceil(disposed.length / ARCHIVE_PAGE_SIZE));
  const safePage = Math.min(page, totalPages - 1);
  const pageItems = disposed.slice(safePage * ARCHIVE_PAGE_SIZE, safePage * ARCHIVE_PAGE_SIZE + ARCHIVE_PAGE_SIZE);

  const toggleSelect = (id) => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const handleRowClick = (w) => {
    if (selectMode) toggleSelect(w.id);
    else onOpenWaste(w);
  };

  const handleDeleteSelected = async () => {
    const targets = disposed.filter((w) => selected.has(w.id));
    if (targets.length === 0) return;
    const ok = await onDeleteWastes(targets);
    if (ok) {
      setSelected(new Set());
      setSelectMode(false);
    }
  };

  return (
    <div>
      <TopBar title="廃液タンク・アーカイブ" onBack={onBack} />
      <div style={{ padding: 16, paddingBottom: 100 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <SectionLabel>処分済みのタンク（{disposed.length}）</SectionLabel>
          <button
            onClick={() => {
              setSelectMode((v) => !v);
              setSelected(new Set());
            }}
            style={{ border: `1.5px solid ${C.line}`, background: selectMode ? HEADER.bg : C.paper, color: selectMode ? "#fff" : C.ink, fontSize: 11.5, fontWeight: 700, borderRadius: 8, padding: "6px 10px", cursor: "pointer" }}
          >
            {selectMode ? "選択をやめる" : "選択して削除"}
          </button>
        </div>

        {disposed.length === 0 && (
          <div style={{ textAlign: "center", padding: "30px 12px", color: C.inkSoft, fontSize: 13 }}>
            処分済みのタンクはまだありません。
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
          {pageItems.map((w) => {
            const isSelected = selected.has(w.id);
            return (
              <button
                key={w.id}
                onClick={() => handleRowClick(w)}
                style={{ textAlign: "left", background: C.paper, border: `1px solid ${isSelected ? C.danger : C.line}`, borderRadius: 12, padding: "13px 14px", overflow: "hidden", cursor: "pointer", display: "flex" }}
              >
                <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 10 }}>
                  {selectMode && (
                    <div
                      style={{
                        width: 20, height: 20, borderRadius: 5, border: `1.5px solid ${isSelected ? C.danger : C.line}`,
                        background: isSelected ? C.danger : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                      }}
                    >
                      {isSelected && <Check size={13} color="#fff" />}
                    </div>
                  )}
                  <div style={{ flex: 1 }}>
                    <WasteCodeTag waste={w} />
                    <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 6, display: "flex", alignItems: "center", gap: 4 }}>
                      <Lock size={11} /> 処分済み（{w.disposedAt || "日付不明"}）
                    </div>
                  </div>
                  {!selectMode && <Chevron />}
                </div>
              </button>
            );
          })}
        </div>

        {totalPages > 1 && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, marginBottom: 10 }}>
            <button
              onClick={() => setPage((p) => Math.max(0, p - 1))}
              disabled={safePage === 0}
              style={{ border: `1px solid ${C.line}`, background: C.paper, color: safePage === 0 ? C.line : C.ink, fontSize: 12, fontWeight: 700, borderRadius: 8, padding: "6px 12px", cursor: safePage === 0 ? "default" : "pointer" }}
            >
              ‹ 前へ
            </button>
            <span style={{ fontSize: 12, color: C.inkSoft, fontFamily: "'Roboto Mono', monospace" }}>
              {safePage + 1} / {totalPages}
            </span>
            <button
              onClick={() => setPage((p) => Math.min(totalPages - 1, p + 1))}
              disabled={safePage >= totalPages - 1}
              style={{ border: `1px solid ${C.line}`, background: C.paper, color: safePage >= totalPages - 1 ? C.line : C.ink, fontSize: 12, fontWeight: 700, borderRadius: 8, padding: "6px 12px", cursor: safePage >= totalPages - 1 ? "default" : "pointer" }}
            >
              次へ ›
            </button>
          </div>
        )}
      </div>

      {selectMode && selected.size > 0 && (
        <div style={{ position: "sticky", bottom: 0, background: C.paper, borderTop: `1px solid ${C.line}`, padding: "14px 16px calc(14px + env(safe-area-inset-bottom, 0px))" }}>
          <button
            onClick={handleDeleteSelected}
            style={{ width: "100%", border: "none", background: C.danger, color: "#fff", fontSize: 14, fontWeight: 700, borderRadius: 12, padding: "13px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
          >
            <Trash2 size={16} /> 選択した{selected.size}件を削除
          </button>
        </div>
      )}
    </div>
  );
}

/*  薬品詳細ページ                                                      */

function ChemicalDetail({ chemical, waste, onBack, onEdit, onOpenLocation, onOpenWaste, onRecord, onDelete, onRecordWaste }) {
  const status = autoStatus(chemical.stock);
  const stockKnown = !!chemical.stock && chemical.stock.known !== false;
  const hasWaste = !!waste;
  const wasteDisposed = hasWaste && !!waste.disposed;
  // 「この薬品の廃液を記録する」は、処分済み（アーカイブ）のタンクには書き込ませない
  const canRecordWaste = hasWaste && !wasteDisposed;
  // waste（廃液分類）が見つからない場合でも、薬品側に保存しておいたコード・名称のスナップショットがあれば
  // それを使って表示する（元の分類が完全削除された後もラベルだけは残せるようにするため）
  const archivedLabel = !hasWaste && chemical.wasteLabel ? chemical.wasteLabel : null;
  const safeWaste = waste || (archivedLabel ? { ...UNKNOWN_WASTE, code: archivedLabel.code, name: archivedLabel.name } : UNKNOWN_WASTE);

  return (
    <div>
      <TopBar
        title={chemical.name}
        onBack={onBack}
        right={
          <button
            onClick={() => onEdit(chemical)}
            style={{ border: `1.5px solid ${HEADER.border}`, background: "transparent", color: HEADER.text, fontSize: 12, fontWeight: 700, borderRadius: 8, padding: "7px 11px", cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}
          >
            <Pencil size={13} /> 編集
          </button>
        }
      />
      <HazardStripe />
      <div style={{ padding: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
          <FormulaTag formula={chemical.formula} size={16} />
          <AutoStatusBadge statusKey={status} />
        </div>

        <SectionLabel>在庫状況（g）</SectionLabel>
        <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
          <div style={{ fontFamily: "'Roboto Mono', monospace", fontSize: stockKnown ? 26 : 16, fontWeight: 600, color: C.ink }}>
            {stockKnown ? (
              <>
                {chemical.stock.amount}
                <span style={{ fontSize: 14, color: C.inkSoft, fontWeight: 500 }}> g</span>
              </>
            ) : (
              status === "full" ? "未開封（FULL）" : STATUS_META[status].sub
            )}
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <button
              onClick={() => stockKnown && onRecord(chemical)}
              disabled={!stockKnown}
              style={{ flex: 1, border: "none", background: HEADER.bg, color: "#fff", fontSize: 14, fontWeight: 600, borderRadius: 10, padding: "12px", cursor: stockKnown ? "pointer" : "not-allowed", opacity: stockKnown ? 1 : 0.45, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
            >
              <Package size={16} /> {stockKnown ? "使用量を記録する" : STATUS_META[status].sub}
            </button>
            <button
              onClick={() => onDelete(chemical)}
              style={{ border: `1.5px solid ${C.danger}`, background: C.dangerBg, color: C.danger, fontSize: 13, fontWeight: 700, borderRadius: 10, padding: "12px 14px", cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}
            >
              <Trash2 size={15} /> 削除
            </button>
          </div>
        </div>

        {chemical.openDate && (
          <>
            <SectionLabel>開封日</SectionLabel>
            <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 14, padding: "13px 16px", marginBottom: 20, fontSize: 13.5, color: C.ink, display: "flex", alignItems: "center", gap: 8 }}>
              <Calendar size={15} color={C.inkSoft} />
              {chemical.openDate.replace(/-/g, "/")}
            </div>
          </>
        )}

        {chemical.purpose && (
          <>
            <SectionLabel>備考</SectionLabel>
            <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 14, padding: "13px 16px", marginBottom: 20, fontSize: 13.5, color: C.ink, lineHeight: 1.7 }}>
              {chemical.purpose}
            </div>
          </>
        )}

        <SectionLabel>保管場所</SectionLabel>
        <button
          onClick={() => onOpenLocation(chemical.location)}
          style={{ width: "100%", textAlign: "left", background: C.paper, border: `1px solid ${C.line}`, borderRadius: 14, padding: "14px 16px", marginBottom: 20, cursor: "pointer", display: "flex", alignItems: "center", gap: 12 }}
        >
          <div style={{ width: 38, height: 38, borderRadius: 10, background: C.okBg, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <MapPin size={18} color={C.tealDeep} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 600, fontSize: 15, color: C.ink }}>
              {displayLocationName(chemical.location.name)}{chemical.subLocation ? `（${chemical.subLocation}）` : ""}
            </div>
            <div style={{ fontSize: 12.5, color: C.inkSoft, marginTop: 2 }}>{cleanLocationNote(chemical.location.note)}</div>
          </div>
          <Chevron />
        </button>

        <SectionLabel>廃液分類</SectionLabel>
        <button
          onClick={() => hasWaste && onOpenWaste(waste)}
          disabled={!hasWaste}
          style={{ width: "100%", textAlign: "left", background: C.paper, border: `1px solid ${C.line}`, borderRadius: 14, padding: "14px 16px", overflow: "hidden", cursor: hasWaste ? "pointer" : "default", display: "flex", marginBottom: 10, opacity: hasWaste ? 1 : 0.85 }}
        >
          <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 12 }}>
            <Trash2 size={18} color={C.tealDeep} />
            <div style={{ flex: 1 }}>
              {hasWaste || archivedLabel ? (
                <>
                  <WasteCodeTag waste={safeWaste} size="small" />
                  {wasteDisposed && (
                    <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 4, lineHeight: 1.5 }}>
                      このタンクは処分済みです。新しいタンクを使う場合は「編集」で分類を選び直してください
                    </div>
                  )}
                  {!hasWaste && archivedLabel && (
                    <div style={{ fontSize: 11, color: C.inkSoft, marginTop: 4, lineHeight: 1.5 }}>
                      この分類はアーカイブから削除済みです（記録として保持しています）
                    </div>
                  )}
                </>
              ) : (
                <>
                  <div style={{ fontWeight: 600, fontSize: 13.5, color: C.ink }}>{UNKNOWN_WASTE.name}</div>
                  <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 3, lineHeight: 1.5 }}>{renderFormula(UNKNOWN_WASTE.note)}</div>
                </>
              )}
            </div>
            {hasWaste && <Chevron />}
          </div>
        </button>

        <button
          onClick={() => canRecordWaste && onRecordWaste(chemical, waste)}
          disabled={!canRecordWaste}
          style={{ width: "100%", border: `1.5px solid ${C.tealDeep}`, background: C.paper, color: C.ink, fontSize: 14, fontWeight: 700, borderRadius: 12, padding: "12px", cursor: canRecordWaste ? "pointer" : "not-allowed", opacity: canRecordWaste ? 1 : 0.6, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
        >
          <Plus size={16} /> {wasteDisposed ? "処分済みのため記録できません" : "この薬品の廃液を記録する"}
        </button>
      </div>
    </div>
  );
}

/*  薬品編集ページ（分子式・重量・廃液分類・備考を編集可能）                    */

function ChemicalEditPage({ chemical, wasteCategories, onBack, onSave }) {
  const [name, setName] = useState(chemical.name || "");
  const [formula, setFormula] = useState(chemical.formula || "");
  const [cas, setCas] = useState(chemical.cas || CAS_LOOKUP[chemical.name] || "");
  const [locationName, setLocationName] = useState(chemical.location?.name || "");
  const [wasteId, setWasteId] = useState(chemical.wasteId || null);
  const [amount, setAmount] = useState(chemical.stock?.known === false ? "" : String(chemical.stock?.amount ?? ""));
  const [isFull, setIsFull] = useState(chemical.stock?.known === false && chemical.stock?.status === "full");
  const [purpose, setPurpose] = useState(chemical.purpose || "");
  const [openDate, setOpenDate] = useState(chemical.openDate || "");

  // 「FULL（未開封）」から「重量を記入」に切り替えた瞬間＝開封したタイミングとみなし、
  // 開封日が未記入なら今日の日付を自動で入れる（あとから手動で修正可能）
  const wasFullRef = React.useRef(isFull);
  useEffect(() => {
    if (wasFullRef.current && !isFull && !openDate) {
      setOpenDate(todayDateStr());
    }
    wasFullRef.current = isFull;
  }, [isFull]);

  // 「未開封（FULL）」だったかどうかは、開封日を自動入力するタイミングの判定にのみ使う
  // （既存の使用中アイテムを遡って必須にすることはしない）
  const wasUnopenedOnEntry = chemical.stock?.known === false && chemical.stock?.status === "full";
  const isNewlyOpening = wasUnopenedOnEntry && !isFull;

  const inputStyle = {
    width: "100%",
    border: `1.5px solid ${C.line}`,
    borderRadius: 10,
    padding: "10px 13px",
    fontSize: 14.5,
    color: C.ink,
    fontFamily: "'Inter', sans-serif",
    boxSizing: "border-box",
  };

  const locationOptions = LOCATION_OPTIONS.includes(locationName) ? LOCATION_OPTIONS : [locationName, ...LOCATION_OPTIONS];

  const canSave = name.trim() !== "" && locationName !== "" && (isFull || (amount !== "" && !isNaN(parseFloat(amount))));

  const handleSave = () => {
    if (!canSave) return;
    const stock = isFull
      ? { amount: 0, capacity: 0, unit: "g", known: false, status: "full" }
      : { amount: Math.max(0, parseFloat(amount)), capacity: 0, unit: "g", known: true };
    onSave(chemical, { name: name.trim(), formula: formula.trim(), cas: cas.trim(), locationName, subLocation: chemical.subLocation || "", wasteId, stock, purpose: purpose.trim(), openDate: openDate || "" });
  };

  return (
    <div>
      <TopBar title={`${chemical.name}を編集`} onBack={onBack} />
      <div style={{ padding: 16 }}>
        <SectionLabel>薬品名</SectionLabel>
        <input style={{ ...inputStyle, marginBottom: 20 }} value={name} onChange={(e) => setName(e.target.value)} placeholder="例：メタノール" />

        <SectionLabel>分子式（任意）</SectionLabel>
        <input style={{ ...inputStyle, marginBottom: 20, fontFamily: "'Roboto Mono', monospace" }} value={formula} onChange={(e) => setFormula(e.target.value)} placeholder="例：CH3OH（略称でも可）" />

        <SectionLabel>CASナンバー（任意）</SectionLabel>
        <input
          style={{ ...inputStyle, marginBottom: 4, fontFamily: "'Roboto Mono', monospace" }}
          value={cas}
          onChange={(e) => setCas(e.target.value)}
          placeholder="例：67-56-1"
        />
        <div style={{ fontSize: 11.5, color: C.inkSoft, marginBottom: 20 }}>
          普段の画面には表示されず、Excelへの書き出し時にのみ使用します
        </div>

        <SectionLabel>保管場所（必須）</SectionLabel>
        <select style={{ ...inputStyle, marginBottom: 20 }} value={locationName} onChange={(e) => setLocationName(e.target.value)}>
          {locationOptions.map((name) => (
            <option key={name} value={name}>{displayLocationName(name)}</option>
          ))}
        </select>

        <SectionLabel>在庫量（必須）</SectionLabel>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <button
            type="button"
            onClick={() => setIsFull(false)}
            style={{
              flex: 1,
              textAlign: "center",
              border: `1.5px solid ${!isFull ? C.tealDeep : C.line}`,
              background: !isFull ? "#fff" : C.paper,
              color: !isFull ? C.tealDeep : C.inkSoft,
              borderRadius: 10,
              padding: "10px 13px",
              fontSize: 13.5,
              fontWeight: 600,
              cursor: "pointer",
            }}
          >
            重量を記入
          </button>
          <button
            type="button"
            onClick={() => setIsFull(true)}
            style={{
              flex: 1,
              textAlign: "center",
              border: `1.5px solid ${isFull ? C.tealDeep : C.line}`,
              background: isFull ? "#fff" : C.paper,
              color: isFull ? C.tealDeep : C.inkSoft,
              borderRadius: 10,
              padding: "10px 13px",
              fontSize: 13.5,
              fontWeight: 600,
              cursor: "pointer",
            }}
          >
            FULL（未開封）
          </button>
        </div>
        {isFull ? (
          <div style={{ fontSize: 11.5, color: C.inkSoft, marginBottom: 20 }}>
            重量を測らずに「未開封（FULL）」として登録します
          </div>
        ) : (
          <React.Fragment>
            <input type="number" inputMode="decimal" style={{ ...inputStyle, marginBottom: 6 }} value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="現在の重量" />
            <div style={{ fontSize: 11.5, color: C.inkSoft, marginBottom: 20 }}>
              現在の重量を測って入力してください。
            </div>
          </React.Fragment>
        )}

        <SectionLabel>開封日{isNewlyOpening ? "（今日の日付を自動入力）" : "（任意）"}</SectionLabel>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <input
            type="date"
            value={openDate}
            onChange={(e) => setOpenDate(e.target.value)}
            style={{ ...inputStyle, flex: 1 }}
          />
          {openDate && (
            <button
              type="button"
              onClick={() => setOpenDate("")}
              style={{ border: `1.5px solid ${C.line}`, background: "#fff", color: C.inkSoft, fontSize: 12, fontWeight: 600, borderRadius: 8, padding: "10px 12px", cursor: "pointer" }}
            >
              クリア
            </button>
          )}
        </div>
        <div style={{ fontSize: 11.5, color: C.inkSoft, marginBottom: 20 }}>
          {isNewlyOpening
            ? "「FULL」から「重量を記入」に切り替えたので、開封日として今日の日付を自動で入れています。違う日付なら修正してください"
            : "薬品によっては開封後に劣化・変質するものがあります。開封した日を記録しておくと交換・廃棄の目安になります"}
        </div>

        <SectionLabel>備考（任意）</SectionLabel>
        <textarea
          value={purpose}
          onChange={(e) => setPurpose(e.target.value)}
          placeholder="例：DNA抽出時の洗浄用"
          rows={2}
          style={{ ...inputStyle, marginBottom: 20, resize: "none" }}
        />

        <SectionLabel>廃液分類（あとからいつでも変更できます）</SectionLabel>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 26 }}>
          <button
            onClick={() => setWasteId(null)}
            style={{
              textAlign: "left",
              display: "flex",
              alignItems: "center",
              gap: 10,
              border: `1.5px solid ${wasteId === null ? C.tealDeep : C.line}`,
              background: wasteId === null ? "#fff" : C.paper,
              borderRadius: 10,
              padding: "11px 13px",
              cursor: "pointer",
            }}
          >
            <div style={{ flex: 1, fontSize: 13.5, color: C.inkSoft, fontWeight: 600 }}>あとで設定する（未設定）</div>
            {wasteId === null && <Check size={16} color={C.tealDeep} />}
          </button>
          {[...wasteCategories].sort(compareWasteCode).map((w) => {
            const active = wasteId === w.id;
            return (
              <button
                key={w.id}
                onClick={() => setWasteId(w.id)}
                style={{
                  textAlign: "left",
                  display: "flex",
                  alignItems: "center",

function LocationPage({ location, chemicals, onBack, onSelectChemical }) {
  const canonName = canonicalLocationName(location.name);
  const items = chemicals.filter((c) => canonicalLocationName(c.location.name) === canonName);
  const rawLoc = items[0]?.location || location; // 編集後すぐ最新表示にするため
  const loc = { ...rawLoc, name: displayLocationName(canonName), note: cleanLocationNote(rawLoc.note) };

  // 場所の中の細かい区画（例：1, 2, A, B）ごとにグループ化する。
  // 区画が未設定の薬品は「区画未設定」としてまとめて表示する。
  // 各区画内は在庫量（g）の少ない順に並べる。
  const groups = useMemo(() => {
    const map = new Map();
    items.forEach((c) => {
      const key = c.subLocation && c.subLocation.trim() ? c.subLocation.trim() : "";
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(c);
    });
    const entries = Array.from(map.entries());
    entries.forEach(([, list]) => list.sort((a, b) => stockSortValue(a.stock) - stockSortValue(b.stock)));
    entries.sort((a, b) => {
      if (a[0] === "") return 1;
      if (b[0] === "") return -1;
      return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;
    });
    return entries;
  }, [items]);

  return (
    <div>
      <TopBar title="場所案内" onBack={onBack} />
      <div style={{ padding: 16 }}>
        <div style={{ background: C.tealDeep, borderRadius: 16, padding: "22px 18px", color: "#fff", marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, opacity: 0.85, fontSize: 12, marginBottom: 6 }}>
            <MapPin size={14} /> 保管場所
          </div>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 22 }}>{loc.name}</div>
          <div style={{ fontSize: 13, marginTop: 8, opacity: 0.9 }}>{cleanLocationNote(loc.note)}</div>
        </div>

        <SectionLabel>この場所に保管されている薬品（{items.length}）</SectionLabel>
        {groups.map(([key, list]) => (
          <div key={key || "__none__"} style={{ marginBottom: 16 }}>
            {key && (
              <div style={{ fontSize: 12, fontWeight: 700, color: C.tealDeep, marginBottom: 8, fontFamily: "'Roboto Mono', monospace" }}>
                {loc.name}-{key}
              </div>
            )}
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {list.map((c) => (
                <button
                  key={c.id}
                  onClick={() => onSelectChemical(c)}
                  style={{ textAlign: "left", background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}
                >
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{c.name}</div>
                    <div style={{ marginTop: 5 }}>
                      <FormulaTag formula={c.formula} size={11.5} />
                    </div>
                    <div style={{ fontSize: 12.5, color: C.ink, marginTop: 6, fontFamily: "'Roboto Mono', monospace", fontWeight: 600 }}>
                      {stockAmountLabel(c.stock)}
                    </div>
                  </div>
                  <Chevron />
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  g/L 換算計算ツール（分子量・物質量・体積から濃度g/Lを算出）              */
/* ------------------------------------------------------------------ */

function ConcentrationCalcBody({ onApply }) {
  const [molarMass, setMolarMass] = useState("");
  const [mol, setMol] = useState("");
  const [volumeMl, setVolumeMl] = useState("");

  const inputStyle = {
    width: "100%",
    border: `1.5px solid ${C.line}`,
    borderRadius: 10,
    padding: "10px 13px",
    fontSize: 16,
    color: C.ink,
    fontFamily: "'Roboto Mono', monospace",
    boxSizing: "border-box",
  };

  const mm = parseFloat(molarMass);
  const n = parseFloat(mol);
  const v = parseFloat(volumeMl);
  const valid = !isNaN(mm) && !isNaN(n) && !isNaN(v) && v > 0;
  const massG = valid ? mm * n : null;
  const resultGL = valid ? Math.round(((massG / v) * 1000) * 1000) / 1000 : null;

  return (
    <div style={{ padding: 16 }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8, background: C.okBg, border: `1px solid #C6D3E3`, borderRadius: 10, padding: "10px 13px", marginBottom: 20 }}>
        <Info size={15} color={C.inkSoft} style={{ marginTop: 1, flexShrink: 0 }} />
        <span style={{ fontSize: 12.5, color: C.inkSoft, lineHeight: 1.6 }}>
          分子量・物質量(mol)・体積(mL) から、廃液記録に入力する濃度(g/L)を計算します。
        </span>
      </div>

      <SectionLabel>分子量（g/mol）</SectionLabel>
      <input
        type="number"
        inputMode="decimal"
        style={{ ...inputStyle, marginBottom: 16 }}
        value={molarMass}
        onChange={(e) => setMolarMass(e.target.value)}
        placeholder="例：40.00（NaOH）"
      />

      <SectionLabel>物質量（mol）</SectionLabel>
      <input
        type="number"
        inputMode="decimal"
        style={{ ...inputStyle, marginBottom: 16 }}
        value={mol}
        onChange={(e) => setMol(e.target.value)}
        placeholder="使用した物質量"
      />

      <SectionLabel>体積（mL）</SectionLabel>
      <input
        type="number"
        inputMode="decimal"
        style={{ ...inputStyle, marginBottom: 22 }}
        value={volumeMl}
        onChange={(e) => setVolumeMl(e.target.value)}
        placeholder="溶かした先の体積"
      />

      <div
        style={{
          background: valid ? C.tealDeep : C.lockBg,
          borderRadius: 14,
          padding: "20px 18px",
          textAlign: "center",
        }}
      >
        <div style={{ fontSize: 12, color: valid ? "#fff" : C.inkSoft, opacity: valid ? 0.85 : 1, marginBottom: 6 }}>算出された濃度</div>
        <div style={{ fontFamily: "'Roboto Mono', monospace", fontWeight: 700, fontSize: 30, color: valid ? "#fff" : C.inkSoft }}>
          {valid ? resultGL : "―"}
          <span style={{ fontSize: 15, fontWeight: 500 }}> g/L</span>
        </div>
      </div>

      {onApply ? (
        <button
          onClick={() => valid && onApply(resultGL)}
          disabled={!valid}
          style={{ width: "100%", marginTop: 16, border: "none", background: valid ? HEADER.bg : "#B7C0BC", color: "#fff", fontSize: 14.5, fontWeight: 600, borderRadius: 12, padding: "13px", cursor: valid ? "pointer" : "not-allowed", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
        >
          <Check size={16} /> この値を使う
        </button>
      ) : (
        <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 10, textAlign: "center" }}>
          この値を「投入記録を追加」の濃度(g/L)欄に入力してください
        </div>
      )}
    </div>
  );
}

function ConcentrationCalcPage({ onBack }) {
  return (
    <div>
      <TopBar title="g/L 計算ツール" onBack={onBack} titleFont="'Inter', sans-serif" />
      <ConcentrationCalcBody />
    </div>
  );

  // 薬品名がExcel台帳の名称と一致する場合、CASナンバーをまだ手入力していなければ自動で候補を入れる
  // （あとから手動で自由に修正・削除できる）
  useEffect(() => {
    if (casTouched) return;
    const known = CAS_LOOKUP[name.trim()];
    if (known) setCas(known);
  }, [name, casTouched]);

  // 「重量を記入」＝登録した時点で開封済み、とみなして開封日に今日の日付を自動で入れる
  // （FULLに切り替えた場合は未開封なのでクリアする。どちらも手動で修正可）
  const wasFullRef = React.useRef(isFull);
  useEffect(() => {
    if (isFull) {
      setOpenDate("");
    } else if (wasFullRef.current === true && !openDate) {
      setOpenDate(todayDateStr());
    }
    wasFullRef.current = isFull;
  }, [isFull]);

  const canSave = name.trim() && locationName && (isFull || (amount !== "" && !isNaN(parseFloat(amount))));

  const inputStyle = {
    width: "100%",
    border: `1.5px solid ${C.line}`,

    fontSize: 14.5,
    color: C.ink,
    fontFamily: "'Inter', sans-serif",
    boxSizing: "border-box",

  const handleSave = () => {
    if (!canSave) return;
    onSave({
      name: name.trim(),
      formula: formula.trim(),
      cas: cas.trim(),
      locationName,
      subLocation: "",
      amount: isFull ? null : parseFloat(amount),
      isFull,
      purpose: purpose.trim(),
      wasteId,
      openDate: isFull ? "" : openDate,

  return (

        </div>

          style={{ ...inputStyle, marginBottom: 4, fontFamily: "'Roboto Mono', monospace" }}

        <div style={{ fontSize: 11.5, color: C.inkSoft, marginBottom: 16 }}>
