<style>
  html, body { margin: 0; padding: 0; background: #EEF1EC; -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; font-feature-settings: "zero" 1; font-variant-numeric: normal; }
  input, textarea { font-family: inherit; }
  #boot-error { display: none; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-8px); } 40%, 60% { transform: translateX(8px); } }
  @keyframes keyPress { 0% { transform: scale(1); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }
html[data-theme="dark"], html[data-theme="dark"] body { background: #12181A; }

  /* ダークモード切り替え演出用の"カーテン"。
     全要素（renderFormulaが1文字ずつ生成するspanを含む）を個別にアニメーション
     させる代わりに、この1枚だけをフェードさせて色の切り替わりを覆い隠す
     （iPhone Safariでのコマ落ち対策）。 */
  .theme-curtain{
    position: fixed; inset: 0; z-index: 99999;
    background: #EEF1EC;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }

  /* iPad・MacBookなど画面幅が広い端末で、スマホ幅に貼り付いて見えないようにする */
  .app-shell{
    width: 100%;
    max-width: 720px;
    min-height: 100vh;
  }
  @media (min-width: 768px){
    .app-shell{ max-width: 900px; }
  }
  @media (min-width: 1100px){
    .app-shell{ max-width: 1080px; }
  }
</style>
<script>
(function(){
  // 起動時は常にlight固定。splash(manifestのbackground_color)と初期描画色を
  // 一致させることで起動時の色チラつきを防ぐ。ダークにしたい場合は起動後に
  // 手動トグルで都度切り替える方式とし、OS判定・保存は行わない。
  document.documentElement.dataset.theme = 'light';
})();
</script>

<!-- Reactが立ち上がる前に致命的なエラーが起きても、画面が真っ白にならないようにするための安全網。
     Reactのマウントに成功したら自動で非表示になる（下の script で消す）。 -->
<div id="boot-error" style="font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; background: #F6E4E1; border: 1px solid #B23B31; border-radius: 12px; color: #182524;">
  <strong>読み込みエラーが発生しました。</strong>
  <p id="boot-error-message" style="white-space: pre-wrap; word-break: break-word; font-size: 13px;"></p>
  <p style="font-size: 12px; color: #4E625E;">ブラウザの開発者ツール（コンソール）に詳細が出ています。ネットワーク接続や広告ブロッカーが原因で、React・Babel・Firebaseの読み込み自体に失敗している可能性があります。</p>
</div>
<div id="root"></div>
<div id="themeCurtain" class="theme-curtain"></div>

<script>
  window.addEventListener('error', function (e) {
    var box = document.getElementById('boot-error');
    var msg = document.getElementById('boot-error-message');
    if (box && msg && !document.getElementById('root').hasChildNodes()) {
      box.style.display = 'block';
      msg.textContent = (e.message || 'unknown error') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
    }
  });
</script>

// Firestoreのルールを「ログイン済みのみ許可」にするための最低限のログイン。
// 画面上にログインUIは出さず、開いたら自動で匿名サインインする。
function ensureSignedIn() {
  return new Promise((resolve, reject) => {
    if (!window.firebase || !firebase.auth) {
      reject(new Error("firebase.auth が読み込まれていません"));
      return;
    }
    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        resolve(user);
      } else {
        firebase
          .auth()
          .signInAnonymously()
          .catch(reject);
      }
    }, reject);
  });
}

// 初回アクセス時だけ、モックデータをFirestoreに書き込む。
// meta/status ドキュメントの有無で「初回かどうか」を判定するので、
// 一度seedした後にユーザーが全部削除しても再投入はされない。
async function seedIfNeeded() {
  const flagRef = db.collection("meta").doc("status");
  const flagSnap = await flagRef.get();
  if (flagSnap.exists) return;

  const batch = db.batch();

  initialChemicals.forEach((c) => {
    const { id, ...rest } = c;
    batch.set(db.collection("chemicals").doc(id), rest);
  });

  initialWasteCategories.forEach((w) => {
    const { id, entries, ...rest } = w;
    batch.set(db.collection("wasteCategories").doc(id), rest);
    entries.forEach((e) => {
      const { id: entryId, ...entryRest } = e;
      batch.set(db.collection("wasteEntries").doc(entryId), { wasteId: id, ...entryRest });
    });
  });

  batch.set(flagRef, { seeded: true });
  await batch.commit();
}

// 化学式・物質名を表示用に整形する。
// 元素記号や閉じ括弧の直後の数字＝下付き（原子数）。
// それ以外（文字列の先頭・「・」の直後など）の数字＝水和物の係数などなので
// 通常サイズのまま（例：Cu(NO3)2・3H2O → Cu(NO₃)₂・3H₂O の「3」は下付きにしない）。
// 元素記号・閉じ括弧の直後の数字＝原子数（下付き）。
// 文字列先頭・「・」直後・スペース直後の数字＝水和物係数やモル比などの通常数字。
// 上付き（イオン価数 2+ / 3- など）にも対応。
// <sub>タグそのままだと視認性が低いので、独自のスタイル付きspanで表示する。
function renderFormula(text) {
  const nodes = [];
  let i = 0;
  while (i < text.length) {
    const ch = text[i];

    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < text.length && /[0-9]/.test(text[j])) j++;
      const run = text.slice(i, j);
      const prevChar = i > 0 ? text[i - 1] : null;
      const nextChar = j < text.length ? text[j] : null;
      const isChargeSuperscript = nextChar === "+" || nextChar === "-" || nextChar === "−";
      const isSubscript = !!prevChar && /[A-Za-z)\]]/.test(prevChar) && !isChargeSuperscript;

      if (isSubscript) {
        nodes.push(
          <span key={i} style={{ fontSize: "0.76em", verticalAlign: "-0.32em", fontWeight: 700 }}>
            {run}
          </span>
        );
      } else {
        nodes.push(<span key={i} style={{ fontWeight: 600 }}>{run}</span>);
      }
      i = j;
    } else if (ch === "+" || ch === "-" || ch === "−") {
      // イオン価数などの符号（数字の直後）は上付きで表示
      const prevChar = i > 0 ? text[i - 1] : null;
      const isCharge = !!prevChar && /[0-9]/.test(prevChar);
      nodes.push(
        <span
          key={i}
          style={isCharge ? { fontSize: "0.76em", verticalAlign: "0.55em", fontWeight: 700 } : { fontWeight: 600 }}
        >
          {ch}
        </span>
      );
      i++;
    } else if (ch === "・" || ch === "·" || ch === ".") {
      // 水和物の中点は埋もれやすいので、少し余白を足して見やすくする
      nodes.push(
        <span key={i} style={{ margin: "0 1.5px", fontWeight: 700 }}>
          {ch}
        </span>
      );
      i++;
    } else {
      nodes.push(<span key={i} style={{ fontWeight: 600 }}>{ch}</span>);
      i++;
    }
  }
  return nodes;
}

function stockRatio(stock) {
  return stock.capacity > 0 ? stock.amount / stock.capacity : 0;
}

function barColor(stock) {
  const r = stockRatio(stock);
  if (r <= 0.15) return C.danger;
  if (r <= 0.4) return C.amberDeep;
  return C.teal;
}

function autoStatus(stock) {

  return "in_use";
}
// タンク使用開始日から数えた経過日数。未設定なら null。
function daysSinceTankStart(tankStartDate) {
  if (!tankStartDate) return null;
  const start = new Date(tankStartDate + "T00:00:00");
  const diffMs = Date.now() - start.getTime();
  return Math.floor(diffMs / 86400000);
}

// 使用開始から1年(365日)を迎える1ヶ月(30日)前を切ったら注意表示にする
function isTankAgeWarning(waste) {
  if (!waste || waste.disposed || !waste.tankStartDate) return false;
  const days = daysSinceTankStart(waste.tankStartDate);
  return days !== null && days >= 335;
}
     
// 濃度(g/L)を直接入力した記録の集合から、合計使用量・合成濃度(g/L)を算出する
// ※必ず「同じ薬品(substanceName)」の記録同士に対して使うこと
function summarizeEntries(entries) {
  let totalVolumeMl = 0;
  let totalMassG = 0;
  entries.forEach((e) => {
    const massG = e.concentrationGL * (e.volumeMl / 1000);
    totalVolumeMl += e.volumeMl;
    totalMassG += massG;
  });
  const aggregateGL = totalVolumeMl > 0 ? totalMassG / (totalVolumeMl / 1000) : 0;
  return {
    totalVolumeMl: Math.round(totalVolumeMl * 100) / 100,
    aggregateGL: Math.round(aggregateGL * 1000) / 1000,
  };
}

// タンク内の記録を薬品(substanceName)ごとにグループ化する
function groupBySubstance(entries) {
  const map = new Map();
  entries.forEach((e) => {
    if (!map.has(e.substanceName)) map.set(e.substanceName, []);
    map.get(e.substanceName).push(e);
  });
  return Array.from(map.entries()).map(([substanceName, list]) => ({
    substanceName,
    entries: list,
    summary: summarizeEntries(list),
  }));
}

// 廃液コードの並び替え（A→B、数字が小さい順。同じ番号内では強/有→弱/無の順）
function compareWasteCode(a, b) {
  const parse = (code) => {
    const m = code.match(/^([A-Za-z])-(\d+)(.*)$/);
    if (!m) return { letter: code, num: 0, suffix: "" };
    return { letter: m[1], num: parseInt(m[2], 10), suffix: m[3] || "" };
  };
  const suffixRank = { 強: 0, 有: 0, 弱: 1, 無: 1, "": 0, ホ: 2 };
  const pa = parse(a.code);
  const pb = parse(b.code);
  if (pa.letter !== pb.letter) return pa.letter < pb.letter ? -1 : 1;
  if (pa.num !== pb.num) return pa.num - pb.num;
  const ra = suffixRank[pa.suffix] ?? 9;
  const rb = suffixRank[pb.suffix] ?? 9;
  return ra - rb;
}

// 廃液コードの頭文字（A/B）でUIの配色を切り替える（A系統＝青、B系統＝赤）
function wasteAccent(code) {
  const isB = typeof code === "string" && code.trim().toUpperCase().startsWith("B");
  return {
    text: isB ? C.danger : C.teal,         // コードタグなど、地の色の上に乗せる文字色
    deep: isB ? C.dangerDeep : C.tealDeep, // バナー背景など、白文字を乗せる濃色
  };
}

function slugify(name) {
  return "loc_" + name.trim().toLowerCase().replace(/\s+/g, "_") + "_" + Math.random().toString(36).slice(2, 6);
}

/* パスコード入力用のドット表示（アプリのPINコード画面のような見た目） */
function PinDots({ length, minSlots = 6, shake }) {
  const slots = Math.max(minSlots, length);
  return (
    <div style={{ display: "flex", justifyContent: "center", gap: 14, margin: "22px 0 6px", animation: shake ? "shake 0.4s" : "none" }}>
      {Array.from({ length: slots }).map((_, i) => (
        <div
          key={i}
          style={{
            width: 14,
            height: 14,
            borderRadius: "50%",
            border: `2px solid ${C.tealDeep}`,
            background: i < length ? C.tealDeep : "transparent",
            transition: "background 0.12s",
          }}
        />
      ))}
    </div>
  );
}

    fontWeight: 600,

    alignItems: "center",
    justifyContent: "center",

  };
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, maxWidth: 260, margin: "0 auto" }}>

              <Backspace size={20} color={C.inkSoft} />
            </button>
          );
        }
        return (
          <button key={i} type="button" onClick={() => onDigit(k)} disabled={disabled} style={{ ...btnBase, justifySelf: "center" }}>
            {k}
          </button>
        );
      })}
    </div>
  );
}

function PasscodeModal({ title, message, onCancel, onSubmit, correctPasscode }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState("");
  const [shake, setShake] = useState(false);
  const maxLen = 8;

  const triggerShake = (msg) => {
    setError(msg);
    setShake(true);
    setTimeout(() => {
      setShake(false);
      setValue("");
    }, 350);
  };

  const handleDigit = (d) => {
    if (value.length >= maxLen) return;
    const next = value + d;
    setValue(next);
    setError("");
    if (next.length >= (correctPasscode || "").length) {
      if (next === correctPasscode) {
        onSubmit();
      } else {
        triggerShake("パスコードが違います。");
      }
    }
  };

  const handleBackspace = () => {
    setValue((v) => v.slice(0, -1));
    setError("");
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(24,37,36,0.55)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 20 }}>
      <div style={{ background: C.paper, borderRadius: 16, padding: "20px 20px 26px", width: "100%", maxWidth: 340 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <Lock size={16} color={C.tealDeep} />
          <div style={{ fontWeight: 700, fontSize: 15, color: C.ink }}>{title}</div>
        </div>
        <div style={{ fontSize: 13, color: C.inkSoft, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{message}</div>

        <PinDots length={value.length} minSlots={Math.max(4, (correctPasscode || "").length)} shake={shake} />
        <div style={{ minHeight: 16, textAlign: "center", marginBottom: 10 }}>
          {error && <span style={{ fontSize: 12, color: C.danger }}>{error}</span>}
        </div>

        <NumericKeypad onDigit={handleDigit} onBackspace={handleBackspace} />

        <button
          onClick={onCancel}
          style={{ width: "100%", marginTop: 20, border: `1px solid ${C.line}`, background: "transparent", color: C.inkSoft, fontSize: 14, fontWeight: 600, borderRadius: 10, padding: "11px", cursor: "pointer" }}
        >
          キャンセル
        </button>
      </div>
    </div>
  );
}

function LocationTab({ chemicals, extraLocations, onOpenLocation, onAddLocation, onReorder, onDelete }) {
  const locations = useMemo(() => {
    const map = new Map();
    chemicals.forEach((c) => {
      if (!map.has(c.location.id)) map.set(c.location.id, { ...c.location, items: [] });
      map.get(c.location.id).items.push(c);
    });
    // まだ薬品が置かれていない、追加だけされた場所もここに合流させる
    (extraLocations || []).forEach((l) => {
      if (!map.has(l.id)) map.set(l.id, { id: l.id, name: l.name, note: l.note || "", items: [] });
    });
    // 場所メタ情報(extraLocations)にorderがあれば、薬品由来の場所にもマージする
    const metaById = new Map((extraLocations || []).map((l) => [l.id, l]));
    const list = Array.from(map.values()).map((loc) => ({
      ...loc,
      order: typeof metaById.get(loc.id)?.order === "number" ? metaById.get(loc.id).order : null,
    }));
    list.sort((a, b) => {
      const ao = a.order === null ? Infinity : a.order;
      const bo = b.order === null ? Infinity : b.order;
      if (ao !== bo) return ao - bo;
      return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
    });
    return list;
  }, [chemicals, extraLocations]);

  return (
    <div style={{ padding: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <SectionLabel>保管場所一覧</SectionLabel>
        <button
          onClick={onAddLocation}
          style={{ border: "none", background: HEADER.bg, color: "#fff", fontSize: 12, fontWeight: 700, borderRadius: 8, padding: "7px 11px", cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}
        >
          <Plus size={13} /> 場所を追加
        </button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {locations.map((loc, index) => (
          <div
            key={loc.id}
            style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 12, padding: "13px 14px", display: "flex", alignItems: "center", gap: 10 }}
          >
            <div style={{ display: "flex", flexDirection: "column", gap: 3, flexShrink: 0 }}>
              <button
                onClick={() => onReorder(locations, index, "up")}
                disabled={index === 0}
                aria-label="上に移動"
                style={{ border: "none", background: "transparent", cursor: index === 0 ? "default" : "pointer", opacity: index === 0 ? 0.3 : 1, padding: 2, display: "flex" }}
              >
                <ChevronRight size={14} color={C.inkSoft} style={{ transform: "rotate(-90deg)" }} />
              </button>
              <button
                onClick={() => onReorder(locations, index, "down")}
                disabled={index === locations.length - 1}
                aria-label="下に移動"
                style={{ border: "none", background: "transparent", cursor: index === locations.length - 1 ? "default" : "pointer", opacity: index === locations.length - 1 ? 0.3 : 1, padding: 2, display: "flex" }}
              >
                <ChevronRight size={14} color={C.inkSoft} style={{ transform: "rotate(90deg)" }} />
              </button>
            </div>
            <button
              onClick={() => onOpenLocation(loc)}
              style={{ textAlign: "left", border: "none", background: "transparent", padding: 0, display: "flex", alignItems: "center", gap: 10, flex: 1, cursor: "pointer" }}
            >
              <div style={{ width: 34, height: 34, borderRadius: 9, background: C.okBg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <MapPin size={16} color={C.tealDeep} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, fontSize: 14.5, color: C.ink }}>{loc.name}</div>
                <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 2 }}>
                  {loc.items.length}品目{loc.note ? `・${loc.note}` : ""}
                </div>
              </div>
              <Chevron />
            </button>
            <button
              onClick={() => onDelete(loc)}
              aria-label="削除"
              style={{ border: `1.5px solid ${C.danger}`, background: C.dangerBg, color: C.danger, borderRadius: 8, padding: "7px", cursor: "pointer", display: "flex", flexShrink: 0 }}
            >
              <Trash2 size={13} />
            </button>
          </div>
        ))}
        {locations.length === 0 && (
          <div style={{ textAlign: "center", color: C.inkSoft, fontSize: 13, padding: "40px 0" }}>
            保管場所がまだありません
          </div>
        )}
      </div>
    </div>
  );
}

function ChangePasscodePage({ onBack, onSave }) {
  const [step, setStep] = useState("enter"); // "enter" | "confirm"
  const [firstCode, setFirstCode] = useState("");
  const [value, setValue] = useState("");
  const [error, setError] = useState("");
  const [shake, setShake] = useState(false);
  const minLen = 4;
  const maxLen = 8;

  const triggerShake = (msg) => {
    setError(msg);
    setShake(true);
    setTimeout(() => setShake(false), 350);
  };

  const handleDigit = (d) => {
    if (value.length >= maxLen) return;
    setValue((v) => v + d);
    setError("");
  };

  const handleBackspace = () => {
    setValue((v) => v.slice(0, -1));
    setError("");
  };

  const handleConfirm = () => {
    if (value.length < minLen) {
      triggerShake(`${minLen}桁以上で入力してください。`);
      return;
    }
    if (step === "enter") {
      setFirstCode(value);
      setValue("");
      setError("");
      setStep("confirm");
    } else {
      if (value === firstCode) {
        onSave(value);
      } else {
        triggerShake("パスコードが一致しません。最初からやり直してください。");
        setTimeout(() => {
          setValue("");
          setFirstCode("");
          setStep("enter");
        }, 400);
      }
    }
  };

  return (
    <div>
      <TopBar title="パスコードの変更" onBack={onBack} />
      <div style={{ padding: 16 }}>
        <div style={{ textAlign: "center", marginTop: 16, fontSize: 14, fontWeight: 600, color: C.ink }}>
          {step === "enter" ? "新しいパスコードを入力" : "確認のためもう一度入力"}
        </div>
        <div style={{ textAlign: "center", fontSize: 11.5, color: C.inkSoft, marginTop: 4 }}>
          {minLen}〜{maxLen}桁の数字
        </div>

        <PinDots length={value.length} minSlots={minLen} shake={shake} />
        <div style={{ minHeight: 16, textAlign: "center", marginBottom: 6 }}>
          {error && <span style={{ fontSize: 12, color: C.danger }}>{error}</span>}
        </div>

        <NumericKeypad onDigit={handleDigit} onBackspace={handleBackspace} />

        <button
          onClick={handleConfirm}
          disabled={value.length < minLen}
          style={{ width: "100%", marginTop: 22, border: "none", background: value.length >= minLen ? HEADER.bg : "#B7C0BC", color: "#fff", fontSize: 15, fontWeight: 600, borderRadius: 12, padding: "13px", cursor: value.length >= minLen ? "pointer" : "not-allowed", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
        >
          {step === "enter" ? "次へ" : <><Save size={16} /> 変更を保存</>}
        </button>

        <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 16, textAlign: "center" }}>
          変更後は、処分・削除・新規タンク追加などすべての操作でこの新しいパスコードが必要になります。
        </div>
      </div>
    </div>
  );
}

const ARCHIVE_PAGE_SIZE = 20;

function WasteArchivePage({ wasteCategories, onBack, onOpenWaste, onDeleteWastes }) {
  const disposed = useMemo(
    () => [...wasteCategories].filter((w) => w.disposed).sort(compareWasteCode),
    [wasteCategories]
  );

  const [page, setPage] = useState(0);
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState(() => new Set());

  const totalPages = Math.max(1, Math.ceil(disposed.length / ARCHIVE_PAGE_SIZE));
  const safePage = Math.min(page, totalPages - 1);
  const pageItems = disposed.slice(safePage * ARCHIVE_PAGE_SIZE, safePage * ARCHIVE_PAGE_SIZE + ARCHIVE_PAGE_SIZE);

  const toggleSelect = (id) => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const handleRowClick = (w) => {
    if (selectMode) toggleSelect(w.id);
    else onOpenWaste(w);
  };

  const handleDeleteSelected = async () => {
    const targets = disposed.filter((w) => selected.has(w.id));
    if (targets.length === 0) return;
    const ok = await onDeleteWastes(targets);
    if (ok) {
      setSelected(new Set());
      setSelectMode(false);
    }
  };

  return (
    <div>
      <TopBar title="廃液タンク・アーカイブ" onBack={onBack} />
      <div style={{ padding: 16, paddingBottom: 100 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <SectionLabel>処分済みのタンク（{disposed.length}）</SectionLabel>
          <button
            onClick={() => {
              setSelectMode((v) => !v);
              setSelected(new Set());
            }}
            style={{ border: `1.5px solid ${C.line}`, background: selectMode ? HEADER.bg : C.paper, color: selectMode ? "#fff" : C.ink, fontSize: 11.5, fontWeight: 700, borderRadius: 8, padding: "6px 10px", cursor: "pointer" }}
          >
            {selectMode ? "選択をやめる" : "選択して削除"}
          </button>
        </div>

        {disposed.length === 0 && (
          <div style={{ textAlign: "center", padding: "30px 12px", color: C.inkSoft, fontSize: 13 }}>
            処分済みのタンクはまだありません。
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
          {pageItems.map((w) => {
            const isSelected = selected.has(w.id);
            return (
              <button
                key={w.id}
                onClick={() => handleRowClick(w)}
                style={{ textAlign: "left", background: C.paper, border: `1px solid ${isSelected ? C.danger : C.line}`, borderRadius: 12, padding: "13px 14px", overflow: "hidden", cursor: "pointer", display: "flex" }}
              >
                <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 10 }}>
                  {selectMode && (
                    <div
                      style={{
                        width: 20, height: 20, borderRadius: 5, border: `1.5px solid ${isSelected ? C.danger : C.line}`,
                        background: isSelected ? C.danger : "transparent",
                        display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                      }}
                    >
                      {isSelected && <Check size={13} color="#fff" />}
                    </div>
                  )}
                  <div style={{ flex: 1 }}>
                    <WasteCodeTag waste={w} />
                    <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 6, display: "flex", alignItems: "center", gap: 4 }}>
                      <Lock size={11} /> 処分済み（{w.disposedAt || "日付不明"}）
                    </div>
                  </div>
                  {!selectMode && <Chevron />}
                </div>
              </button>
            );
          })}
        </div>

        {totalPages > 1 && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, marginBottom: 10 }}>
            <button
              onClick={() => setPage((p) => Math.max(0, p - 1))}
              disabled={safePage === 0}
              style={{ border: `1px solid ${C.line}`, background: C.paper, color: safePage === 0 ? C.line : C.ink, fontSize: 12, fontWeight: 700, borderRadius: 8, padding: "6px 12px", cursor: safePage === 0 ? "default" : "pointer" }}
            >
              ‹ 前へ
            </button>
            <span style={{ fontSize: 12, color: C.inkSoft, fontFamily: "'Roboto Mono', monospace" }}>
              {safePage + 1} / {totalPages}
            </span>
            <button
              onClick={() => setPage((p) => Math.min(totalPages - 1, p + 1))}
              disabled={safePage >= totalPages - 1}
              style={{ border: `1px solid ${C.line}`, background: C.paper, color: safePage >= totalPages - 1 ? C.line : C.ink, fontSize: 12, fontWeight: 700, borderRadius: 8, padding: "6px 12px", cursor: safePage >= totalPages - 1 ? "default" : "pointer" }}
            >
              次へ ›
            </button>
          </div>
        )}
      </div>

      {selectMode && selected.size > 0 && (
        <div style={{ position: "sticky", bottom: 0, background: C.paper, borderTop: `1px solid ${C.line}`, padding: "14px 16px calc(14px + env(safe-area-inset-bottom, 0px))" }}>
          <button
            onClick={handleDeleteSelected}
            style={{ width: "100%", border: "none", background: C.danger, color: "#fff", fontSize: 14, fontWeight: 700, borderRadius: 12, padding: "13px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
          >
            <Trash2 size={16} /> 選択した{selected.size}件を削除
          </button>
        </div>
      )}
    </div>
  );
}

function LocationPage({ location, chemicals, onBack, onSelectChemical, onEdit }) {
  const items = chemicals.filter((c) => c.location.id === location.id);
  const loc = items[0]?.location || location; // 編集後すぐ最新表示にするため

  // 場所の中の細かい区画（例：1, 2, A, B）ごとにグループ化する。
  // 区画が未設定の薬品は「区画未設定」としてまとめて表示する。
  const groups = useMemo(() => {
    const map = new Map();
    items.forEach((c) => {
      const key = c.subLocation && c.subLocation.trim() ? c.subLocation.trim() : "";
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(c);
    });
    const entries = Array.from(map.entries());
    entries.sort((a, b) => {
      if (a[0] === "") return 1;
      if (b[0] === "") return -1;
      return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;
    });
    return entries;
  }, [items]);

  return (
    <div>
      <TopBar
        title="場所案内"
        onBack={onBack}
        right={
          <button
            onClick={() => onEdit(loc)}

        <SectionLabel>この場所に保管されている薬品（{items.length}）</SectionLabel>
        {groups.map(([key, list]) => (
          <div key={key || "__none__"} style={{ marginBottom: 16 }}>

                  </div>
                  <Chevron />

  const inputStyle = {

/* ------------------------------------------------------------------ */
/*  g/L 換算計算ツール（分子量・物質量・体積から濃度g/Lを算出）              */
/* ------------------------------------------------------------------ */

function ConcentrationCalcBody({ onApply }) {
  const [molarMass, setMolarMass] = useState("");
  const [mol, setMol] = useState("");
  const [volumeMl, setVolumeMl] = useState("");

  const inputStyle = {
    width: "100%",
    border: `1.5px solid ${C.line}`,
    borderRadius: 10,
    padding: "10px 13px",
    fontSize: 16,
    color: C.ink,
    fontFamily: "'Roboto Mono', monospace",
    boxSizing: "border-box",
  };

  const mm = parseFloat(molarMass);
  const n = parseFloat(mol);
  const v = parseFloat(volumeMl);
  const valid = !isNaN(mm) && !isNaN(n) && !isNaN(v) && v > 0;
  const massG = valid ? mm * n : null;
  const resultGL = valid ? Math.round(((massG / v) * 1000) * 1000) / 1000 : null;

  return (
    <div style={{ padding: 16 }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8, background: C.okBg, border: `1px solid #C6D3E3`, borderRadius: 10, padding: "10px 13px", marginBottom: 20 }}>
        <Info size={15} color={C.inkSoft} style={{ marginTop: 1, flexShrink: 0 }} />
        <span style={{ fontSize: 12.5, color: C.inkSoft, lineHeight: 1.6 }}>
          分子量・物質量(mol)・体積(mL) から、廃液記録に入力する濃度(g/L)を計算します。
        </span>
      </div>

      <SectionLabel>分子量（g/mol）</SectionLabel>
      <input
        type="number"
        inputMode="decimal"
        style={{ ...inputStyle, marginBottom: 16 }}
        value={molarMass}

/* ------------------------------------------------------------------ */

const TABS = [
  { key: "search", label: "検索", icon: Search },
  { key: "location", label: "場所", icon: MapPin },
  { key: "inventory", label: "在庫", icon: Package },
  { key: "waste", label: "廃液", icon: Trash2 },
];

function ChemStockApp() {
  const [chemicals, setChemicals] = useState([]);
  const [wasteMeta, setWasteMeta] = useState([]);
  const [wasteEntriesRaw, setWasteEntriesRaw] = useState([]);
  const [locationsMeta, setLocationsMeta] = useState([]);
  const [loading, setLoading] = useState(true);
  const [fatalError, setFatalError] = useState(firebaseInitError ? String(firebaseInitError.message || firebaseInitError) : null);
  const [homeTab, setHomeTab] = useState("search");
  const [stack, setStack] = useState([{ view: "home" }]);
const [passcodeGate, setPasscodeGate] = useState(null);
const [adminPasscode, setAdminPasscode] = useState(DEFAULT_ADMIN_PASSCODE);
const [theme, setTheme] = useState("light");
Object.assign(C, theme === "dark" ? DARK_TOKENS : LIGHT_TOKENS);
useEffect(() => {
  document.documentElement.dataset.theme = theme;
}, [theme]);
const toggleTheme = () => {
  const next = theme === "dark" ? "light" : "dark";
  const curtain = document.getElementById("themeCurtain");
  if (!curtain) {
    // 万一カーテン要素が無い場合は従来通り即切り替え
    setTheme(next);
    return;
  }
  // 1) 切り替え後の背景色でカーテンを画面全体にフェードイン（覆い隠す）
  curtain.style.background = next === "dark" ? DARK_TOKENS.bg : LIGHT_TOKENS.bg;
  curtain.style.opacity = "1";
  // 2) カーテンが覆い切ったタイミングで、Reactの状態を裏側で切り替える
  window.setTimeout(() => {
    setTheme(next);
    // 3) 切り替え済みの画面をカーテンごしにフェードアウトさせて見せる
    requestAnimationFrame(() => {
      curtain.style.opacity = "0";
    });
  }, 260);
};

  // ログイン（匿名）→ 初回だけモックデータを流し込み → Firestore購読、の順で立ち上げる。
  // どこで失敗しても画面が真っ白にならないよう、必ずエラーを画面に出す。
  useEffect(() => {
    if (firebaseInitError) return;
    let unsubChem, unsubWaste, unsubEntries, unsubSettings, unsubLocations;
    let cancelled = false;

    ensureSignedIn()
      .then(() => seedIfNeeded())
      .then(() => {
        if (cancelled) return;
        unsubChem = db.collection("chemicals").onSnapshot(
          (snap) => {
            setChemicals(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
            setLoading(false);
          },
          (err) => {
            console.error("chemicals subscription error", err);
            setFatalError("薬品データの取得に失敗しました：" + err.message);
            setLoading(false);
          }
        );
        unsubWaste = db.collection("wasteCategories").onSnapshot(
          (snap) => setWasteMeta(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (err) => {
            console.error("wasteCategories subscription error", err);
            setFatalError("廃液分類データの取得に失敗しました：" + err.message);
          }
        );
        unsubEntries = db.collection("wasteEntries").onSnapshot(
          (snap) => setWasteEntriesRaw(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (err) => {
            console.error("wasteEntries subscription error", err);
            setFatalError("廃液記録データの取得に失敗しました：" + err.message);
          }
        );
        unsubSettings = db.collection("meta").doc("settings").onSnapshot(
          (snap) => {
            if (snap.exists && snap.data().passcode) {
              setAdminPasscode(snap.data().passcode);
            }
          },
          (err) => console.error("settings subscription error", err)
        );
        // 「場所を追加」で作った、まだ薬品が無い保管場所を保持するコレクション
        unsubLocations = db.collection("locations").onSnapshot(
          (snap) => setLocationsMeta(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
          (err) => console.error("locations subscription error", err)
        );
      })
      .catch((err) => {
        console.error("startup failed", err);
        if (!cancelled) {
          setFatalError("起動処理に失敗しました：" + (err.message || String(err)));
          setLoading(false);
        }
      });

    return () => {
      cancelled = true;
      if (unsubChem) unsubChem();
      if (unsubWaste) unsubWaste();
      if (unsubEntries) unsubEntries();
      if (unsubSettings) unsubSettings();
      if (unsubLocations) unsubLocations();
    };
  }, []);

  // wasteCategories（メタ情報）＋wasteEntries（投入記録）を、既存の画面コンポーネントが
  // 期待する「entries を内包したカテゴリ配列」の形に合成する
  const wasteCategories = useMemo(
    () => wasteMeta.map((w) => ({ ...w, entries: wasteEntriesRaw.filter((e) => e.wasteId === w.id) })),
    [wasteMeta, wasteEntriesRaw]
  );

  const current = stack[stack.length - 1];

  const push = (entry) => setStack((s) => [...s, entry]);
  const pop = () => setStack((s) => (s.length > 1 ? s.slice(0, -1) : s));
  const goHome = (tab) => {
    setStack([{ view: "home" }]);
    if (tab) setHomeTab(tab);
  };

  const handleSaveMass = async (chemId, used) => {
    const chem = chemicals.find((c) => c.id === chemId);
    if (!chem) return;
    const newAmount = Math.max(0, +(chem.stock.amount - used).toFixed(2));
    await db.collection("chemicals").doc(chemId).update({ "stock.amount": newAmount });
  };

  const handleAddChemical = async ({ name, formula, locationName, locationNote, subLocation, capacity, purpose, wasteId }) => {
    const trimmedName = locationName.trim();
    const existingFromChem = chemicals.find((c) => c.location.name.trim() === trimmedName)?.location;
    const existingFromLoc = locationsMeta.find((l) => (l.name || "").trim() === trimmedName);
    const location =
      existingFromChem ||
      (existingFromLoc
        ? { id: existingFromLoc.id, name: existingFromLoc.name, note: existingFromLoc.note || "" }
        : { id: slugify(trimmedName), name: trimmedName, note: locationNote || "" });
    const newId = "c_" + Date.now();
    await db
      .collection("chemicals")
      .doc(newId)
      .set({ name, formula: formula || "", location, subLocation: subLocation || "", stock: { amount: capacity, capacity, unit: "g" }, purpose: purpose || "", wasteId: wasteId || null });
    goHome("inventory");
  };

  const handleEditChemical = async (chem, { formula, subLocation, wasteId }) => {
    await db.collection("chemicals").doc(chem.id).update({
      formula: formula || "",
      subLocation: subLocation || "",
      wasteId: wasteId || null,
    });
    pop();
  };

  const handleEditLocation = async (location, { name, note }) => {
    const batch = db.batch();
    chemicals
      .filter((c) => c.location.id === location.id)
      .forEach((c) => {
        batch.update(db.collection("chemicals").doc(c.id), {
          "location.name": name,
          "location.note": note,
        });
      });
    // 薬品がまだ無い場所（「場所を追加」で作った場所）の名前・補足もここで一緒に保存する
    batch.set(db.collection("locations").doc(location.id), { name, note }, { merge: true });
    await batch.commit();
    pop();
  };

  const handleAddLocation = async ({ name, note }) => {
    const id = slugify(name);
    const maxOrder = Math.max(-1, ...locationsMeta.map((l) => (typeof l.order === "number" ? l.order : -1)));
    await db.collection("locations").doc(id).set({ name, note: note || "", order: maxOrder + 1 });
    goHome("location");
  };

  // 場所の並び替え：表示順(order)を全件に振り直し、対象の2件だけ入れ替えて保存する
  const handleReorderLocation = async (orderedLocations, index, direction) => {
    const targetIndex = direction === "up" ? index - 1 : index + 1;
    if (targetIndex < 0 || targetIndex >= orderedLocations.length) return;
    const batch = db.batch();
    orderedLocations.forEach((loc, i) => {
      let newOrder = i;
      if (i === index) newOrder = targetIndex;
      if (i === targetIndex) newOrder = index;
      batch.set(db.collection("locations").doc(loc.id), { name: loc.name, note: loc.note || "", order: newOrder }, { merge: true });
    });
    await batch.commit();
  };

  const handleDeleteLocation = async (loc) => {
    if (loc.items && loc.items.length > 0) {
      if (typeof window !== "undefined" && window.alert) {
        window.alert("この場所にはまだ薬品があります。先に薬品を削除するか、別の場所に移してから削除してください。");
      }
      return;
    }
    if (typeof window !== "undefined" && window.confirm) {
      if (!window.confirm(`「${loc.name}」を保管場所一覧から削除しますか？`)) return;
    }
    await db.collection("locations").doc(loc.id).delete();
  };

  const handleDeleteChemical = async (chem) => {
    if (typeof window !== "undefined" && window.confirm) {
      if (!window.confirm(`「${chem.name}」を薬品一覧から削除しますか？`)) return;
    }
    await db.collection("chemicals").doc(chem.id).delete();
    pop();
  };

  const handleAddWasteEntry = async (wasteId, entry) => {
    const { id, ...rest } = entry;
    await db.collection("wasteEntries").doc(id).set({ wasteId, ...rest });
    const cat = wasteMeta.find((w) => w.id === wasteId);
    if (cat && !cat.tankStartDate) {
      await db.collection("wasteCategories").doc(wasteId).update({ tankStartDate: entry.date });
    }
    pop();
  };

  const handleDeleteWasteEntry = async (wasteId, entry) => {
    if (typeof window !== "undefined" && window.confirm) {
      if (!window.confirm(`${entry.date}・${entry.personName}の記録（${entry.substanceName}）を削除しますか？`)) return;
    }
    await db.collection("wasteEntries").doc(entry.id).delete();
    pop();
  };
     
const handleDisposeWaste = (waste) => {
  setPasscodeGate({
    title: "処分済みへの変更",
    message: `「${waste.code} ${waste.name}」のタンクを処分済みにします。\nこの操作の後は編集ができなくなります。`,
    onCancel: () => setPasscodeGate(null),
    onConfirm: async () => {
      await db.collection("wasteCategories").doc(waste.id).update({
        disposed: true,
        disposedAt: new Date().toISOString().slice(0, 10),
      });
      setPasscodeGate(null);
      goHome("waste");
    },
  });
};

const handleAddWasteCategory = ({ code, name, note, color }) => {
  setPasscodeGate({
    title: "タンクの新規追加",
    message: `次の廃液タンクを新規追加します。\n\n${code} ${name}`,
    onCancel: () => setPasscodeGate(null),
    onConfirm: async () => {
      const newId = "w_" + Date.now();
      await db.collection("wasteCategories").doc(newId).set({
        code,
        name,
        note,
        color,
        disposal: DISPOSAL_POLICY,
        tankStartDate: null,
      });
      setPasscodeGate(null);
      goHome("waste");
    },
  });
};

const handleOpenChangePasscode = () => {
  setPasscodeGate({
    title: "本人確認",
    message: "パスコードを変更するには、現在のパスコードを入力してください。",
    onCancel: () => setPasscodeGate(null),
    onConfirm: () => {
      setPasscodeGate(null);
      push({ view: "changePasscode" });
    },
  });
};

const handleSavePasscode = async (newPasscode) => {
  await db.collection("meta").doc("settings").set({ passcode: newPasscode }, { merge: true });
  goHome("waste");
};

const handleDeleteWasteCategories = (wastes) => {
  if (!wastes || wastes.length === 0) return Promise.resolve(false);
  return new Promise((resolve) => {
    const names = wastes.map((w) => `・${w.code} ${w.name}`).join("\n");
    setPasscodeGate({
      title: "アーカイブの削除",
      message: `次のタンクをアーカイブから完全に削除します。\n投入記録もすべて削除され、元に戻せません。\n\n${names}`,
      onCancel: () => {
        setPasscodeGate(null);
        resolve(false);
      },
      onConfirm: async () => {
        const batch = db.batch();
        wastes.forEach((w) => {
          batch.delete(db.collection("wasteCategories").doc(w.id));
          w.entries.forEach((e) => batch.delete(db.collection("wasteEntries").doc(e.id)));
        });
        await batch.commit();
        setPasscodeGate(null);
        resolve(true);
      },
    });
  });
};
     
  const findChem = (id) => chemicals.find((c) => c.id === id);
  const findWaste = (id) => wasteCategories.find((w) => w.id === id);

  if (fatalError) {
    return (
      <div style={{ fontFamily: "'Inter', sans-serif", background: C.bg, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <style>{FONT_IMPORT}</style>
        <div style={{ maxWidth: 420, background: C.dangerBg, border: `1px solid ${C.danger}`, borderRadius: 14, padding: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: C.danger, fontWeight: 700, marginBottom: 8 }}>
            <AlertTriangle size={18} /> 読み込みエラー
          </div>
          <div style={{ fontSize: 13, color: C.ink, lineHeight: 1.7, wordBreak: "break-word" }}>{fatalError}</div>
          <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 12, lineHeight: 1.6 }}>
            多くの場合、Firestoreのセキュリティルールやプロジェクト設定が原因です。ブラウザの開発者ツール（コンソール）にも詳細が出ています。
          </div>
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{ fontFamily: "'Inter', sans-serif", background: C.bg, minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
        <style>{FONT_IMPORT}</style>
        <Spinner />
        <div style={{ color: C.inkSoft, fontSize: 13 }}>読み込み中…</div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "'Inter', sans-serif", background: C.bg, minHeight: "100vh", display: "flex", justifyContent: "center" }}>
      <style>{FONT_IMPORT}</style>
      <div className="app-shell" style={{ background: C.bg, display: "flex", flexDirection: "column" }}>
        {current.view === "home" && (
          <>
            <TopBar
  title="THEMIS"
  subtitle="薬品在庫・廃液管理システム"
  right={
    <button
      onClick={toggleTheme}
      aria-label="ダークモード切替"
      style={{ border: "none", background: "rgba(255,255,255,.14)", color: HEADER.text, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", width: 32, height: 32, borderRadius: 999, padding: 0, flex: "0 0 auto", fontSize: 14 }}
    >
      {theme === "dark" ? "☀️" : "🌙"}
    </button>
  }
/>

            <HazardStripe height={4} />

            <div style={{ display: "flex", gap: 6, padding: "12px 16px 0 16px" }}>
              {TABS.map((t) => {
                const active = homeTab === t.key;
                const Icon = t.icon;
                return (
                  <button
                    key={t.key}
                    onClick={() => setHomeTab(t.key)}
                    style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "9px 4px", borderRadius: 10, border: "none", cursor: "pointer", background: active ? HEADER.bg : "transparent", color: active ? "#fff" : C.inkSoft, fontSize: 11.5, fontWeight: 600, transition: "background 0.15s" }}
                  >
                    <Icon size={16} />
                    {t.label}
                  </button>
                );
              })}
            </div>

            <div style={{ flex: 1, overflowY: "auto" }}>
              {homeTab === "search" && <SearchTab chemicals={chemicals} onSelect={(c) => push({ view: "detail", id: c.id })} />}
              {homeTab === "location" && (
                <LocationTab
                  chemicals={chemicals}
                  extraLocations={locationsMeta}
                  onOpenLocation={(loc) => push({ view: "location", loc })}
                  onAddLocation={() => push({ view: "addLocation" })}
                  onReorder={handleReorderLocation}
                  onDelete={handleDeleteLocation}
                />
              )}
              {homeTab === "inventory" && (
                <InventoryTab
                  chemicals={chemicals}
                  onRecord={(c) => push({ view: "record", id: c.id })}
                  onAdd={() => push({ view: "addChemical" })}
                  onDelete={handleDeleteChemical}
                />
              )}
              {homeTab === "waste" && (
                <WasteTab
                  wasteCategories={wasteCategories}
                   onOpenWaste={(w) => push({ view: "waste", wasteId: w.id })}
                   onOpenCalc={() => push({ view: "calc" })}
                   onOpenArchive={() => push({ view: "wasteArchive" })}
                   onAddWaste={() => push({ view: "addWaste" })}
                   onChangePasscode={handleOpenChangePasscode}
                 />
               )}
            </div>
          </>
        )}

        {current.view === "detail" && (
          findChem(current.id) ? (
            <ChemicalDetail
              chemical={findChem(current.id)}
              waste={findWaste(findChem(current.id).wasteId)}
              onBack={pop}
              onEdit={(c) => push({ view: "editChemical", id: c.id })}
              onOpenLocation={(loc) => push({ view: "location", loc })}
              onOpenWaste={(w) => push({ view: "waste", wasteId: w.id })}
              onRecord={(c) => push({ view: "record", id: c.id })}
              onDelete={handleDeleteChemical}
              onRecordWaste={(c, w) => push({ view: "wasteEntryAdd", wasteId: w.id, lockedSubstanceName: c.name })}
            />
          ) : (
            <MissingItemNotice title="薬品が見つかりません" message="この薬品はすでに削除されているか、データが見つかりませんでした。" onBack={pop} />
          )
        )}

        {current.view === "editChemical" && (
          findChem(current.id) ? (
            <ChemicalEditPage
              chemical={findChem(current.id)}
              wasteCategories={wasteCategories}
              onBack={pop}
              onSave={handleEditChemical}
            />
          ) : (
            <MissingItemNotice title="薬品が見つかりません" message="この薬品はすでに削除されているか、データが見つかりませんでした。" onBack={pop} />
          )
        )}

                {current.view === "location" && (
          <LocationPage
            location={current.loc}
            chemicals={chemicals}
            onBack={pop}
            onSelectChemical={(c) => push({ view: "detail", id: c.id })}
            onEdit={(loc) => push({ view: "editLocation", loc })}
          />
        )}

        {current.view === "editLocation" && (
          <LocationEditPage location={current.loc} onBack={pop} onSave={handleEditLocation} />
        )}

        {current.view === "waste" && (
          findWaste(current.wasteId) ? (
            <WastePage
              waste={findWaste(current.wasteId)}
              onBack={pop}
              onOpenSubstance={(substanceName) => push({ view: "wasteSubstance", wasteId: current.wasteId, substanceName })}
              onAddOther={() => push({ view: "wasteEntryAdd", wasteId: current.wasteId })}
              onDispose={handleDisposeWaste}
            />
          ) : (
            <MissingItemNotice title="廃液分類が見つかりません" message="この廃液分類はすでに削除されているか、データが見つかりませんでした。" onBack={pop} />
          )
        )}
           
         {current.view === "wasteArchive" && (
           <WasteArchivePage
             wasteCategories={wasteCategories}
             onBack={pop}
             onOpenWaste={(w) => push({ view: "waste", wasteId: w.id })}
             onDeleteWastes={handleDeleteWasteCategories}
           />
         )}
           
        {current.view === "wasteSubstance" && (
          findWaste(current.wasteId) ? (
            <WasteSubstancePage
              waste={findWaste(current.wasteId)}
              substanceName={current.substanceName}
              onBack={pop}
              onOpenEntry={(e) => push({ view: "wasteEntry", wasteId: current.wasteId, entryId: e.id })}
              onAddEntry={() => push({ view: "wasteEntryAdd", wasteId: current.wasteId, lockedSubstanceName: current.substanceName })}
            />
          ) : (
            <MissingItemNotice title="廃液分類が見つかりません" message="この廃液分類はすでに削除されているか、データが見つかりませんでした。" onBack={pop} />
          )
        )}

        {current.view === "wasteEntry" && (
          findWaste(current.wasteId) && findWaste(current.wasteId).entries.find((e) => e.id === current.entryId) ? (
            <WasteEntryPage
              waste={findWaste(current.wasteId)}
              entry={findWaste(current.wasteId).entries.find((e) => e.id === current.entryId)}
              onBack={pop}
              onDelete={handleDeleteWasteEntry}
            />
          ) : (
            <MissingItemNotice title="投入記録が見つかりません" message="この投入記録はすでに削除されているか、データが見つかりませんでした。" onBack={pop} />
          )
        )}

        {current.view === "wasteEntryAdd" && (
          findWaste(current.wasteId) ? (
            <WasteEntryAddPage
              waste={findWaste(current.wasteId)}
              lockedSubstanceName={current.lockedSubstanceName}
              onBack={pop}
              onSave={handleAddWasteEntry}
            />
          ) : (
            <MissingItemNotice title="廃液分類が見つかりません" message="この廃液分類はすでに削除されているか、データが見つかりませんでした。" onBack={pop} />
          )
        )}

        {current.view === "calc" && <ConcentrationCalcPage onBack={pop} />}

        {current.view === "record" && (
          findChem(current.id) ? (
            <RecordMassPage chemical={findChem(current.id)} onBack={pop} onSave={handleSaveMass} />
          ) : (
            <MissingItemNotice title="薬品が見つかりません" message="この薬品はすでに削除されているか、データが見つかりませんでした。" onBack={pop} />
          )
        )}

        {current.view === "addChemical" && (
          <AddChemicalPage wasteCategories={wasteCategories} onBack={pop} onSave={handleAddChemical} />
        )}

        {current.view === "addLocation" && (
          <AddLocationPage onBack={pop} onSave={handleAddLocation} />
        )}

        {current.view === "addWaste" && (
          <AddWasteCategoryPage onBack={pop} onSave={handleAddWasteCategory} />
        )}

        {current.view === "changePasscode" && (
          <ChangePasscodePage onBack={pop} onSave={handleSavePasscode} />
        )}
      </div>
      {passcodeGate && (
        <PasscodeModal
          title={passcodeGate.title}
          message={passcodeGate.message}
          onCancel={passcodeGate.onCancel}
          onSubmit={passcodeGate.onConfirm}
          correctPasscode={adminPasscode}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ChemStockApp />);
document.getElementById('boot-error').style.display = 'none';
</script>
</body>
</html>
